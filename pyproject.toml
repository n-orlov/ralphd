[project]
name = "ralphd"
version = "0.1.0.dev0"
description = "Locally runnable, dockerized autonomous coding loop (Ralph technique) driven by pi"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nikolai Orlov" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = ["httpx>=0.27", "rich>=13.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "rich>=13.7", "ruff>=0.4"]

[project.scripts]
ralphctl = "ralphd.cli.main:main"
ralphd-engine = "ralphd.engine.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ralphd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "ASYNC230",  # blocking open() of small local state files is deliberate
    "BLE001",    # supervisor catches everything by design: record, don't vanish
    "PLW1510",   # sh() wrapper inspects returncode explicitly
    "RUF012",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
