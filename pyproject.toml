[project]
name = "ralphd"
# First release of the line the roadmap records as shipped (v0.1-v0.6). The same
# string is spelled in src/ralphd/__init__.py (__version__, served by
# `GET /version` and both --version flags); tests/test_packaging_metadata.py
# holds the two in agreement and checks the docs' claims against them.
version = "0.28.0"
description = "Locally runnable, dockerized autonomous coding loop (Ralph technique) driven by pi"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nikolai Orlov" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

# One extra, and every requirement in it is used by something in this repo --
# tests/test_packaging_metadata.py names where, so a dependency that stops being
# used (as `httpx`/`rich` never were in the dropped `cli` extra) fails the suite
# instead of shipping forever in the metadata.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3.8", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.4", "build>=1.0", "hatchling>=1.20"]

[project.scripts]
ralphctl = "ralphd.cli.main:main"
ralphd-engine = "ralphd.engine.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ralphd"]

# The job image's inputs, shipped as package data (task 038, #20 H4): a wheel /
# pipx install has no checkout next to it, so without these there is no
# `container/Dockerfile` to hash and nothing to build -- see docs/architecture.md
# and cli/image.py's PACKAGED_FILES, which a test compares this mapping against.
# Mapped rather than duplicated in the source tree, so there is still exactly
# one container/Dockerfile and one pyproject.toml in the repo.
[tool.hatch.build.targets.wheel.force-include]
"container" = "ralphd/_image/container"
"pyproject.toml" = "ralphd/_image/pyproject.toml"
"README.md" = "ralphd/_image/README.md"
"LICENSE" = "ralphd/_image/LICENSE"
# The operator skill (task 023, requirement R, #88): a wheel/pipx install has
# no skills/ checkout next to it either, so `ralphctl skills install` needs
# its own copy of skills/ralphd under the installed package -- mapped the
# same way container/ is, but kept OUT of `image.PACKAGED_FILES` (it is not
# a job-image input; `stage_inputs` must never copy it into a build context).
# `image.packaged_skill_dir` reads this exact target; a test compares this
# mapping against it so packaging and code cannot drift apart.
"skills" = "ralphd/_image/skills"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "ASYNC230",  # blocking open() of small local state files is deliberate
    "BLE001",    # supervisor catches everything by design: record, don't vanish
    "PLW1510",   # sh() wrapper inspects returncode explicitly
    "RUF012",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# NOTHING ELSE BOUNDS A HUNG TEST (#203). This engine legitimately awaits
# forever in places an operator releases -- `_park_until_resumed` waits on an
# `asyncio.Event` that only `resume()`/`POST /resume` clears -- and a test that
# reaches such a state inside a bare `asyncio.run(...)` never wakes: an event
# loop whose selector holds nothing but its own self-pipe is not slow, it is
# parked. Measured 14 Sep 2026: four simultaneous live pytest processes with
# `00:00:00` of accumulated CPU time, and separately one iteration that spent
# 42 of its 45 minutes inside a single invocation. There are 414 unbounded
# `asyncio.run(` call sites under tests/ and one of them bounds itself.
#
# Without this setting the only backstops are sized for whole phases: the
# worker's bash tool abandons the command WITHOUT killing it, the engine's
# `iteration_timeout_s` costs a whole iteration with no task completed, and
# `gate.yml`'s `timeout-minutes: 45` concludes as `cancelled`, which is not a
# verdict (#189). Each turns a ten-second authoring mistake into a ten- to
# forty-five-minute loss carrying no diagnosis.
#
# 120 s is ~5x headroom over the slowest real test measured
# (`test_host_like_pytest_script.py`, 24.6 s); a genuinely slower test should
# carry its own `@pytest.mark.timeout(N)` rather than raise this floor.
#
# `thread` is load-bearing and not the default: a `signal`-method timeout
# never fires while the main thread is blocked in `ep_poll`, which is exactly
# the signature above. The thread method dumps every thread's stack before it
# goes, so the failure names the await instead of leaving dots.
timeout = 120
timeout_method = "thread"
markers = [
    "browser: playwright-cli browser e2e tests for the hub (skip cleanly if playwright-cli is absent)",
    "docker: docker-sibling container-level e2e tests (skip cleanly if the docker socket is absent)",
    "smoke: the per-task tier (task 004, G.8) -- in-process engine flows, in-process CLI, in-process hub, docs-against-code checks; no real engine/ralphctl process. Applied by derivation in tests/conftest.py, budget in docs/testing.md",
    "fast: the final-sha tier (task 004, G.8) -- smoke plus the stub-pi flows and the process-boundary CLI tests; everything outside the nightly docker/browser/dev-layout lanes. Applied by derivation in tests/conftest.py, budget in docs/testing.md",
    "real_backoff: opt-out from tests/conftest.py's autouse class-level LoopSupervisor._wait_out_backoff stub (task 047, B.4 cure) -- used only by the three PRD-named modules that test the backoff/retry schedule itself.",
    "nightly: this individual node belongs in the nightly lane, not fast/smoke -- applied directly to a node (task 048, B.5 follow-on), never derived, unlike docker/browser/dev-layout",
]
