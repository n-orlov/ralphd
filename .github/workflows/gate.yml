# The blocking gate (#113 step 1): the fast tier, on two dedicated workstation
# slots.
#
# This is the only lane a merge waits on for correctness of the pure-Python
# surface, and the only lane that runs on every push and every pull request.
# It ran on `ubuntu-latest` until 14 Sep 2026, when it became the reason the
# n-orlov account hit 90 % of its included Actions minutes: this was the
# ONLY hosted lane left, and at 258 runs / 1718 minutes of wall clock in the
# first two weeks of September it was spending essentially the whole 2000-minute
# monthly allowance by itself (heavy.yml and nightly.yml are self-hosted and
# therefore free). Two things that did NOT motivate the move, and are not
# weakened by it: the check run is produced and signed by GitHub's own Actions
# app wherever the runner executes, so it is still the sha-keyed attestation
# the review contract reads in place of the retired self-authored sweep-sha
# ledger (requirement A.1, v0.20.2); and this lane still needs no docker socket
# and no browser, which is why the label set below asks for neither.
#
# THE VPS IS RETIRED (operator decision, later on 14 Sep 2026, superseding the
# VPS partition this comment described earlier the same day). It was a 4-core /
# 7 GB box, and that was the whole reason this lane took ~12 minutes rather than
# anything about the workflow. The fleet is now, in full:
#
#   - int21h-ws-5 and int21h-ws-6 carry `fast-lane` and NOTHING else. This lane
#     runs there and nowhere else.
#   - int21h-ws-1 .. int21h-ws-4 carry `ralphd-vps`, `docker-host` and
#     `browser-runner` and NOT `fast-lane`. heavy.yml and nightly.yml run there
#     and nowhere else.
#   - no VPS slot exists any more.
#
# So the partition survives the move; only its two halves changed machines. It
# is still a pair of exclusions and still unsafe to "tidy up" one half of:
# adding `docker-host` to this job's `runs-on`, or adding any other label to
# slots 5 and 6, makes the long lanes able to occupy the slots this one depends
# on. That reservation is the point of slots 5-6 existing rather than simply
# labelling the four that were already there -- nightly.yml's six-cell matrix
# runs `fail-fast: false` for 67-89 minutes and heavy.yml holds two slots for
# 14-21 minutes at a time, and a push's gate run must never queue behind that.
#
# All six slots are on ONE 12-core host, so this lane and the long lanes still
# contend for CPU even though they never contend for a slot. That is priced into
# the worker count below and into `timeout-minutes`.
#
# `ralphd-vps` is now doubly a misnomer -- it names workstation slots and no VPS
# remains in the fleet at all. Renaming it means editing heavy.yml, nightly.yml
# and tests/test_ci_dev_layout_matrix_guard.py in one go; still #189's subject.
#
# The interpreter is pinned to `python3.12` explicitly rather than following
# heavy.yml's `python3 -m venv` idiom, which resolves to the host default --
# 3.14.5 here. What the pin does NOT do is fix the patch level, and the move
# changed it: the VPS was Ubuntu 24.04 (`python3.12` = 3.12.3) and this host is
# Fedora 44 (`python3.12` = 3.12.14). 3.12.3 is exactly the interpreter whose
# argparse leftover-positional behaviour exposed #182 and kept this lane red for
# 14 commits on 14 Sep, so the fleet has lost that coverage. Accepted knowingly,
# and the reason #205 is filed: a lane's interpreter should be a property of an
# image named in this file, not of whichever host answered the dispatch.
# The venv goes on `$GITHUB_PATH` so that both
# pytest steps below stay literally unchanged:
# `tests/test_gate_pinned_worker_count_guard.py` pins the records-lint step's
# `run` string exactly, and a `.venv/bin/python` prefix would break it.
#
# `-m fast` is a superset of `-m smoke` and of `tests/records/` (5329 of 5409
# collected at 3bd7199; records is 199 of them), so this one selection
# covers the records lint and both per-task tiers. The records step runs
# first anyway -- it is ~10 s and a docs- or report-only commit that breaks
# a claim checker should say so in seconds rather than after the whole
# tier.
#
# What this lane deliberately does NOT cover: the docker tier, the browser
# tier and the dev-layout matrix. Those are heavy.yml and nightly.yml, on the
# workstation's four slots -- with four registered, heavy.yml's docker and
# browser tiers can overlap each other (only the operator's own
# `browser-runner` label keeps the browser tier serial across workflows, and
# see #193: all four slots carry it today, so that serialisation is not
# currently in force), and nightly.yml's six dev-layout cells run at
# `max-parallel: 2`. docs/ci.md carries the fleet's current shape.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# EVERY COMMIT ON `main` GETS ITS OWN VERDICT (operator decision, 14 Sep 2026).
#
# This keyed the group on the ref alone, so every push to `main` shared one group
# and each new push cancelled the one before it. That is the right behaviour when
# commits arrive slower than the lane takes, and the wrong one here: a job pushing
# a commit every 9-12 minutes into a lane that takes ~13 outruns it permanently.
# Measured over 13-14 Sep, `gate` concluded 32 `cancelled` against 45 `success`
# and 10 `failure`, i.e. more than a third of this lane's output was a non-verdict
# -- `cancelled` says nothing in either direction. Neither the operator nor a job
# reading its own newest CONCLUDED run could tell whether the suite was green at
# the commit in hand, and on 14 Sep that ambiguity hid a real regression for 14
# commits and 3 h 15 m.
#
# Keying on the sha for pushes fixes it without making anything wait: runs for
# different commits are now in different groups, so they run concurrently instead
# of killing each other. `cancel-in-progress` stays true because within one group
# it now means only "a re-dispatch of the SAME sha supersedes the older attempt",
# which is all it should ever have meant here.
#
# Pull requests keep the per-ref behaviour on purpose. A superseded PR head really
# is not worth a runner, and nothing reads a per-sha verdict for a PR's
# intermediate commits.
#
# CAPACITY, stated plainly because this trades one failure mode for another. With
# no cancellation, ~13 min of work arriving every ~9-12 min needs about 1.5 slots
# on average and about 2.1 in the observed bursts, against the two `fast-lane`
# slots the VPS carries. So this lane now runs near saturation and a burst will
# QUEUE. That is an acceptable trade and not a regression of the same kind: a
# queued run still concludes and still produces a verdict, just later, whereas a
# cancelled one never produces anything. Raising the ceiling means moving this
# lane off a 4-core box, which needs #205 first -- the same tier has 8 host-caused
# failures on the workstation today, so a bigger host cannot be adopted until the
# lane stops inheriting one.
#
# Note the deliberate asymmetry with heavy.yml, which still collapses pushes onto
# one group. Not an oversight: `heavy` is 14-21 minutes across two jobs, only the
# final code sha has to be green for the release contract, and nothing reads an
# intermediate `heavy` result the way a running job reads `gate` at task start.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: fast tier (records + smoke + fast)
    # `fast-lane` and NOTHING else -- see the partition note at the top of this
    # file. Asking for only this label is what confines the job to slots 5 and 6
    # and keeps it out of the long lanes' way; adding `docker-host` or
    # `browser-runner` here would make it eligible for slots 1-4 and re-create
    # the starvation those two slots exist to prevent.
    runs-on: [self-hosted, linux, x64, fast-lane]
    # 45, unchanged, and now carrying far more headroom than when it was set.
    # It was sized for the VPS: 67 s records lint + 710 s (11:50) `-n 2` fast
    # tier + venv build, ~16 min, at d37733c. On this host the same `-n 2`
    # recipe is 592 s, and a whole job measured 7:45 and 8:51 on slots 5 and 6.
    #
    # The headroom is deliberately NOT trimmed to match, and the reasons got
    # stronger rather than weaker with this move. All six slots share 12 cores,
    # so a job here can run beside heavy.yml's docker and browser tiers or
    # nightly.yml's matrix and its wall clock is contended in a way it never
    # was on a box of its own. And the per-sha concurrency group above means
    # several of these are in flight at once by design. A `timeout-minutes`
    # kill reports as `cancelled`, which is not a verdict -- having removed the
    # other source of spurious `cancelled` runs, spending headroom to shave
    # minutes off a green lane would trade away the thing that bought.
    timeout-minutes: 45
    steps:
      # Task 054 (K.3): stamp the job's own start so the LAST step below can
      # tell a `timeout-minutes` kill apart from a human cancel and from a
      # `cancel-in-progress` supersession -- all three report `cancelled`
      # and the API exposes no field that separates them. See
      # scripts/job_timeout_marker.sh's header for the mechanism, and
      # scripts/run_bounded.sh's for the per-step half that keeps this job
      # from reaching its job-level bound in the first place.
      - name: Record the job start time
        run: echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The records lint reads real git history (tests/report_claims.py
          # resolves declared shas against the object store), so a depth-1
          # checkout would fail it for the wrong reason.
          fetch-depth: 0

      # Replaces `actions/setup-python` + `cache: pip`, neither of which this
      # runner needs: Fedora 44 carries python3.12 as a packaged interpreter
      # (3.12.14) alongside its own 3.14 default, so there is no per-run
      # interpreter download, and `~/.cache/pip` persists
      # between jobs because every job runs as the same user on the same disk.
      # `rm -rf .venv` is not optional -- a self-hosted workspace is reused
      # across runs, so a venv left by an earlier commit would otherwise be
      # installed over rather than rebuilt.
      #
      # Wrapped in scripts/run_bounded.sh (task 054, K.3) like every other
      # step here that can consume real wall clock: a pip resolve against a
      # slow or wedged index is one of the two ways this job has ever
      # approached its own `timeout-minutes`, and an inner bound turns that
      # into a step `failure` carrying the RALPHD_TIMEOUT_KILL marker
      # instead of an ambiguous job-level `cancelled`. The `$GITHUB_PATH`
      # append stays outside the bound: it is a single write with no
      # network and nothing to time out.
      - name: Build a clean venv on python3.12
        run: |
          scripts/run_bounded.sh 300 "venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3.12 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -e ".[dev]"
          '
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Report the environment
        run: |
          python -V
          echo "cores: $(nproc)"
          python -m pytest --version

      # THE SWEEP-SHA PRACTICE IS RETIRED ENTIRE (requirement A.1, v0.20.2).
      #
      # `tests/sweep_sha_guard.py`, `tests/test_sweep_sha_guard.py` and
      # `docs/sweep-records.md` are deleted outright -- not just the
      # HEAD-relative currency check and discharge chain a previous wave
      # already trimmed this down to (task 053, #113 step 4), but the last
      # surviving lint too ("every record names some sha"). A GitHub-signed
      # check run keyed to the sha is the attestation review reads now; a
      # markdown file declaring a sha inside a fenced block is not.
      # Also bounded (task 054, K.3): a records-lint node that parks on an
      # await would otherwise burn this job's whole `timeout-minutes` and
      # report `cancelled`, which is not a verdict.
      - name: Records lint
        run: |
          scripts/run_bounded.sh 300 "records lint" -- python -m pytest -q tests/records/

      # `-n 2 --dist loadfile`: loadfile keeps a module's tests on one worker,
      # which is what this suite's module-scoped fixtures assume
      # (docs/testing.md, "Recipes"). The count is a fixed integer and
      # deliberately not `-n auto`, which would re-derive it from `nproc` at
      # collection time and make the worker count -- and with it this suite's
      # oversubscription-sensitive flake rate -- a property of whatever else the
      # host is doing (`tests/test_gate_pinned_worker_count_guard.py` fails the
      # suite if this becomes `auto`).
      #
      # BACK TO 2, HAVING MEASURED 4 AND FOUND IT RED. 9899016 raised this to 4
      # on the evidence that the tier is 592 s at `-n 2` and 378 s at `-n 4` on
      # this host. The speed-up was real -- the job went from ~8 min to 6:18 and
      # then 4:23 -- and so was the cost: `-n 4` failed BOTH of its runs
      # (9899016, b0361e1) on the same two nodes,
      # `test_cli_logs_pty_termios.py::test_sigint_restores_termios_mode` and
      # `test_cli_logs_signal.py::test_sigint_during_follow_exits_clean_no_traceback`,
      # while `-n 2` was green on three consecutive runs across both hosts
      # (e3e5723 on the VPS, 1a2b64f on int21h-ws-5, 919a5ca on int21h-ws-6),
      # all three of them already carrying pytest-timeout. So the variable is
      # the worker count and nothing else.
      #
      # The mechanism is not this job in isolation -- 4 workers on 12 cores is
      # not oversubscribed. It is the host: two of these run at once under the
      # per-sha concurrency group, which is 8 workers, while slots 1-4 can be
      # running heavy.yml's docker and browser tiers or nightly.yml's matrix on
      # the same 12 cores. Both failing nodes drive a real subprocess and send
      # it SIGINT, so they are exactly the shape that turns red under scheduling
      # delay rather than under logic error (same family as #179).
      #
      # A faster lane is still available and is NOT bought by turning this
      # number up blind: it needs those two nodes made insensitive to scheduling
      # delay, or the contention removed, measured rather than assumed (#205,
      # #179). Raising this again without that is re-running an experiment whose
      # answer is recorded here.
      # Wrapped in scripts/run_bounded.sh (task 054, K.3). The three inner
      # bounds in this job (venv build 300 + records lint 300 + this one)
      # sum to 40 of its 45 `timeout-minutes`, leaving 5 for the two steps
      # no wrapper owns -- `actions/checkout` and the environment report --
      # which is the reserve tests/test_run_bounded_timeout_marker.py holds
      # every job in every lane to. This bound is many times the duration
      # this tier actually takes on this host at `-n 2` (the figure is in
      # task 054's commit message, not here); it is sized to catch a wedged
      # run, not to shave a slow one. An overrun reports as a step
      # `failure` carrying the RALPHD_TIMEOUT_KILL marker (log text +
      # $GITHUB_STEP_SUMMARY) instead of the job-level bound's ambiguous
      # `cancelled` -- see that script's own header for why a genuine
      # cancel or cancel-in-progress supersession still leaves no marker
      # and still reports `cancelled` as before.
      - name: Fast tier
        run: |
          scripts/run_bounded.sh 1800 "fast tier" -- python -m pytest -q -m fast -n 2 --dist loadfile --durations=15

      # Task 054 (K.3), the classifier half: runs even when this job is
      # cancelled, and prints the RALPHD_TIMEOUT_KILL marker only when the
      # job was still alive as its declared 45-minute bound came due. A
      # human cancel or a `cancel-in-progress` supersession arrives at an
      # arbitrary earlier moment and leaves no marker, so `cancelled` keeps
      # its old meaning in exactly the cases where it was never ambiguous.
      # It cannot change this job's outcome: it always exits 0.
      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 45 "gate fast tier"
