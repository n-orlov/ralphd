# The blocking gate (#113 step 1): the fast tier, on GitHub-hosted runners.
#
# This is the only lane a merge waits on for correctness of the pure-Python
# surface, and the only lane that runs on every push and every pull request.
# It runs on GitHub's own runners deliberately: it is the most frequently
# executed lane, it needs no docker socket and no browser, and a check run
# signed by GitHub's app is the attestation the review contract is meant to
# read -- a GitHub-signed check run keyed to the sha, not a self-authored
# ledger committed to the tree (the sweep-sha practice entire, retired
# outright by task 044, #113 step 4, operator ruling 001-039.md point 3).
#
# `-m fast` is a superset of `-m smoke` and of `tests/records/`, so this
# one selection covers the records lint and both per-task tiers. The
# records step runs first anyway -- it is ~10 s and a docs- or report-only
# commit that breaks a claim checker should say so in seconds rather than
# after the whole tier.
#
# What this lane deliberately does NOT cover: the docker tier, the browser
# tier and the dev-layout matrix. Those are heavy.yml and nightly.yml, on the
# self-hosted VPS's two live runner slots (vmi3245594 and vmi3245594-2,
# docs/ci.md) -- with two slots registered, heavy.yml's docker and browser
# tiers can overlap each other (only the operator's own `browser-runner`
# label, carried by exactly one slot, keeps the browser tier serial across
# workflows), and nightly.yml's six dev-layout cells run at `max-parallel: 2`
# across both.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded push or PR head is not worth a runner: cancel the older run.
# Keyed per ref so main and a PR never cancel each other.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: fast tier (records + smoke + fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The records lint reads real git history (tests/report_claims.py
          # resolves declared shas against the object store), so a depth-1
          # checkout would fail it for the wrong reason.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the package and its dev extra
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Report the environment
        run: |
          python -V
          echo "cores: $(nproc)"
          python -m pytest --version

      # THE SWEEP-SHA PRACTICE ENTIRE IS GONE (task 044, #113 step 4,
      # operator ruling 001-039.md point 3).
      #
      # Task 053 (v0.20) had already reduced the guard module to one lint
      # ("every record names some sha"). Task 044 (v0.20.1) deletes that
      # module, its test module and docs/sweep-records.md outright: a
      # GitHub-signed check run keyed to the sha is the attestation review
      # reads now, and no record owes any sha declaration of its own any
      # more -- existing `sweep-sha`/`archived-sha` blocks under
      # artifacts/reports/ are untouched, inert history.
      - name: Records lint
        run: |
          python -m pytest -q tests/records/

      # `-n 2 --dist loadfile`: loadfile keeps a module's tests on one
      # worker, which is what this suite's module-scoped fixtures assume
      # (docs/testing.md, "Recipes"). The worker count is a fixed `2`, not
      # `-n auto`, because this lane's own "Report the environment" step
      # above prints the runner's actual core count and it has measured `2`
      # on every hosted `ubuntu-latest` run checked for task 012 (check run
      # 103181370436 at sha 35e3225 printed "cores: 2") -- `auto` reads that
      # same `nproc` at test-collection time, so pinning the literal it
      # already resolves to removes no coverage and removes a second,
      # independent source of run-to-run flake (a runner-count change, or
      # transient oversubscription on the shared hosted fleet) on top of the
      # test-order-dependent flake that pinning the count does not touch.
      - name: Fast tier
        run: |
          python -m pytest -q -m fast -n 2 --dist loadfile --durations=15
