# The one CI workflow (v0.35). Every job runs on the elastic runner pool
# (`ci-pool`), in parallel after the trust gate. docs/ci.md describes it.
#
# Jobs: `trusted` (the trust gate), `lint`, `fast`. Later tasks add `docker`,
# `browser`, `report`, `publish` and the single verdict job `required`.
#
# RUNNER LABELS. Every job asks for `self-hosted, linux, x64, ci-pool` plus,
# only where it needs one, a capability label: `docker-host` (the runner gets
# the host docker socket -- a job with `container:` needs it, because the
# runner starts that container itself) or `browser-runner`. No job names a
# standing `int21h-ws-N` slot or `fast-lane`. The one future exception is the
# verdict job, which runs on a GitHub-hosted runner (docs/ci.md).
#
# TRUST. A fork pull request must never reach a self-hosted runner. `trusted`
# carries the trust expression as its OWN job-level `if:`, so GitHub never
# schedules it for a fork PR, and every other self-hosted job `needs` it and is
# conditioned on its output: a skipped dependency skips the dependent. Tightening
# trust later is an edit to that one expression.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's runs share `ci-<ref>` and a newer push cancels the older run.
# A run on `main` (a push or a dispatch) gets a group of its own per sha and is
# never cancelled by a later one, so a regression on a superseded sha is not
# hidden.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trusted:
    name: trust gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ci-pool]
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
    steps:
      # No checkout: this job must not touch the head's code. It only runs when
      # the job-level `if:` above held, so the output is constant.
      - name: Publish the trust decision
        id: gate
        run: echo "trusted=true" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: trusted
    if: needs.trusted.outputs.trusted == 'true'
    runs-on: [self-hosted, linux, x64, ci-pool]
    timeout-minutes: 15
    steps:
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=15" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build a clean venv with ruff
        run: |
          scripts/run_bounded.sh 300 "lint venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet "ruff>=0.4"
          '

      # The syntax-error and undefined-name rules only (E9, F63, F7, F821): the
      # tree is clean under them, and the wider default set has findings this
      # job does not claim.
      - name: Ruff check
        run: |
          scripts/run_bounded.sh 300 "ruff check" -- .venv/bin/ruff check . --select E9,F63,F7,F821

      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 15 "ci lint" "${{ job.status }}"

  fast:
    name: fast tier (smoke + fast)
    needs: trusted
    if: needs.trusted.outputs.trusted == 'true'
    # `docker-host`: the runner starts the `container:` below through the host
    # docker socket, which only a job with that label gets.
    runs-on: [self-hosted, linux, x64, ci-pool, docker-host]
    timeout-minutes: 45
    # The interpreter is pinned by digest, so `python3.12` is 3.12.3 whichever
    # host answers (tests/test_gate_pinned_worker_count_guard.py asserts the
    # patch level). `--cpus=4` bounds the job container to the profile the
    # worker count below is sized for.
    container:
      image: python:3.12.3@sha256:3966b81808d864099f802080d897cef36c01550472ab3955fdd716d1c665acd6
      options: --cpus=4
    steps:
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=45" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust the checked-out workspace (container root != host checkout owner)
        run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Build a clean venv on python3.12
        run: |
          scripts/run_bounded.sh 300 "venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3.12 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -e ".[dev]"
          '
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Report the environment
        run: |
          python -V
          echo "cores: $(nproc)"
          echo "HOME: $HOME"
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            echo "cpu quota (cgroup v2 cpu.max): $(cat /sys/fs/cgroup/cpu.max)"
          elif [ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
            echo "cpu quota (cgroup v1): $(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)/$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
          else
            echo "cpu quota: not exposed by this cgroup layout"
          fi
          python -m pytest --version

      # The suite refuses to run as root (it asserts file-permission behaviour
      # that root bypasses), so the tier runs as a non-root account.
      - name: Create the fast tier's non-root account
        run: |
          useradd -m -u 1000 -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE" "$RALPHD_TIMEOUT_EVIDENCE_DIR" "$HOME"

      # `-m fast` is a superset of `-m smoke`. The worker count is a fixed
      # integer, never `auto`: `auto` re-derives it from `nproc` on every run.
      # `-n 4` is the one authorised raise over the old gate's `-n 2`: the
      # earlier `-n 4` failures were host contention between jobs, and the
      # 4-CPU job container removes it. The wrapped bounds (300 + 1800) leave
      # 600 s of the 45 minutes for checkout and the unwrapped steps.
      # `su -p ci` keeps the job's exported variables across the user switch.
      - name: Fast tier
        run: |
          su -p ci -c 'scripts/run_bounded.sh 1800 "fast tier" -- python -m pytest -q -m fast -n 4 --dist loadfile --durations=15'

      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 45 "ci fast tier" "${{ job.status }}"
