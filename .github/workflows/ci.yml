# The one CI workflow (v0.35). Every job but `required` runs on the elastic
# runner pool (`ci-pool`), in parallel after the trust gate. docs/ci.md describes it.
#
# Jobs: `trusted` (the trust gate), `lint`, `fast`, `docker`, `browser` and the
# single verdict job `required`. Later tasks add `report` and `publish`.
#
# RUNNER LABELS. Every job asks for `self-hosted, linux, x64, ci-pool` plus,
# only where it needs one, a capability label: `docker-host` (the runner gets
# the host docker socket -- a job with `container:` needs it, because the
# runner starts that container itself) or `browser-runner`. No job names a
# standing `int21h-ws-N` slot or `fast-lane`. The one exception is the
# verdict job `required`, which runs on a GitHub-hosted runner (docs/ci.md).
#
# TRUST. A fork pull request must never reach a self-hosted runner. `trusted`
# carries the trust expression as its OWN job-level `if:`, so GitHub never
# schedules it for a fork PR, and every other self-hosted job `needs` it and is
# conditioned on its output: a skipped dependency skips the dependent. Tightening
# trust later is an edit to that one expression.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's runs share `ci-<ref>` and a newer push cancels the older run.
# A run on `main` (a push or a dispatch) gets a group of its own per sha and is
# never cancelled by a later one, so a regression on a superseded sha is not
# hidden.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trusted:
    name: trust gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ci-pool]
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
    steps:
      # No checkout: this job must not touch the head's code. It only runs when
      # the job-level `if:` above held, so the output is constant.
      - name: Publish the trust decision
        id: gate
        run: echo "trusted=true" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: trusted
    if: needs.trusted.outputs.trusted == 'true'
    runs-on: [self-hosted, linux, x64, ci-pool]
    timeout-minutes: 15
    steps:
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=15" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build a clean venv with ruff
        run: |
          scripts/run_bounded.sh 300 "lint venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet "ruff>=0.4"
          '

      # The syntax-error and undefined-name rules only (E9, F63, F7, F821): the
      # tree is clean under them, and the wider default set has findings this
      # job does not claim.
      - name: Ruff check
        run: |
          scripts/run_bounded.sh 300 "ruff check" -- .venv/bin/ruff check . --select E9,F63,F7,F821

      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 15 "ci lint" "${{ job.status }}"

  fast:
    name: fast tier (smoke + fast)
    needs: trusted
    if: needs.trusted.outputs.trusted == 'true'
    # `docker-host`: the runner starts the `container:` below through the host
    # docker socket, which only a job with that label gets.
    runs-on: [self-hosted, linux, x64, ci-pool, docker-host]
    timeout-minutes: 45
    # The interpreter is pinned by digest, so `python3.12` is 3.12.3 whichever
    # host answers (tests/test_gate_pinned_worker_count_guard.py asserts the
    # patch level). `--cpus=4` bounds the job container to the profile the
    # worker count below is sized for.
    container:
      image: python:3.12.3@sha256:3966b81808d864099f802080d897cef36c01550472ab3955fdd716d1c665acd6
      options: --cpus=4
    steps:
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=45" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust the checked-out workspace (container root != host checkout owner)
        run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Build a clean venv on python3.12
        run: |
          scripts/run_bounded.sh 300 "venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3.12 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -e ".[dev]"
          '
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Report the environment
        run: |
          python -V
          echo "cores: $(nproc)"
          echo "HOME: $HOME"
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            echo "cpu quota (cgroup v2 cpu.max): $(cat /sys/fs/cgroup/cpu.max)"
          elif [ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
            echo "cpu quota (cgroup v1): $(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)/$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
          else
            echo "cpu quota: not exposed by this cgroup layout"
          fi
          python -m pytest --version

      # The suite refuses to run as root (it asserts file-permission behaviour
      # that root bypasses), so the tier runs as a non-root account.
      - name: Create the fast tier's non-root account
        run: |
          useradd -m -u 1000 -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE" "$RALPHD_TIMEOUT_EVIDENCE_DIR" "$HOME"

      # `-m fast` is a superset of `-m smoke`. The worker count is a fixed
      # integer, never `auto`: `auto` re-derives it from `nproc` on every run.
      # `-n 4` is the one authorised raise over the old gate's `-n 2`: the
      # earlier `-n 4` failures were host contention between jobs, and the
      # 4-CPU job container removes it. The wrapped bounds (300 + 1800) leave
      # 600 s of the 45 minutes for checkout and the unwrapped steps.
      # `su -p ci` keeps the job's exported variables across the user switch.
      - name: Fast tier
        run: |
          su -p ci -c 'scripts/run_bounded.sh 1800 "fast tier" -- python -m pytest -q -m fast -n 4 --dist loadfile --durations=15 --alluredir=allure-results-fast'

      # The Allure results of this tier (docs/testing.md, "Allure results"),
      # kept even when the tier is red. The name carries the tier and the run
      # id (and the attempt, so a rerun does not collide with attempt 1).
      - name: Upload the fast tier's Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-results-fast
          if-no-files-found: error
          retention-days: 14

      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 45 "ci fast tier" "${{ job.status }}"

  # The docker tier (moved from heavy.yml's `docker-tier`; the steps are
  # unchanged). It runs on the host runner, not in a container: it builds the
  # real job image and drives real sibling containers over the runner's docker
  # socket, which is why it needs `docker-host`. It needs `trusted` and runs
  # beside `lint` and `fast`, not after them.
  docker:
    name: docker tier
    needs: trusted
    if: needs.trusted.outputs.trusted == 'true'
    runs-on: [self-hosted, linux, x64, ci-pool, docker-host]
    timeout-minutes: 120
    env:
      # Per-run image tag isolation: tests/test_docker_sibling_e2e.py builds
      # `ralphd:test-$RALPHD_RUN_ID` (+ `-base`) and labels its siblings
      # `ralphd.run=$RALPHD_RUN_ID`. Without this the whole tier collapses onto
      # the shared `ralphd:test-local-dev` fallback, which is exactly the
      # collision the tag-per-run scheme exists to prevent (F1, #73).
      # tests/conftest.py strips this variable from every spawned engine's
      # environment, so it cannot leak into a child as if this were a job
      # container.
      RALPHD_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Task 054 (K.3): stamp this job's start, its declared bound and a fresh
      # per-job evidence directory, so the classifier step at the end can tell
      # a `timeout-minutes` kill from a human cancel and from
      # this job's own `cancel-in-progress` supersession -- which, on this
      # workflow, is a routine event (pushes collapse onto one group), so
      # `cancelled` here is even more overloaded than on gate. See
      # scripts/job_timeout_marker.sh's header.
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=120" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      # Task 004 (requirement B, #202): reap root-owned test litter BEFORE
      # `actions/checkout` runs, because a poisoned workspace kills this job
      # IN CHECKOUT, before any step of ours could clean it.
      #
      # The docker tier's throwaway registry has to live inside this very
      # checkout for the sibling bind-mount hostpath translation to work, and
      # every run of it writes `configs/<run-id>/record/` -- the authoritative
      # task record, root-owned inside a root-owned 0700 directory, which is
      # exactly the property requirement B asks for. A test whose container is
      # hard-killed (`docker rm -f`) instead of stopped gracefully never runs
      # the engine's `privsep.release_protected_tasks_dir` funnel, so that
      # directory stays root-owned: `git clean -ffdx` cannot remove it, the
      # runner then declares the workspace unclean, tries to recreate it and
      # dies with `EACCES: permission denied, scandir '.../record'` (heavy
      # 35108739999 and 35108738499, both jobs, runner workspaces ws-2 and
      # ws-3). A self-hosted runner reuses its workspace, so the litter is
      # permanent until something with root removes it -- and the only root
      # available on this box is a container's.
      #
      # `tests/test_docker_sibling_e2e.py` reaps its own litter at teardown
      # and sweeps stale litter before its first build; this step is the belt
      # for the case those cannot cover at all -- a tier killed by a
      # `timeout-minutes` bound or a `cancel-in-progress` supersession, whose
      # fixtures never get to run. It is deliberately NOT wrapped in
      # scripts/run_bounded.sh: `scripts/` does not exist yet at this point in
      # the job (nothing is checked out), and the step is a local `rm -rf` of
      # at most a handful of directories. It is listed for exactly that reason
      # in tests/test_run_bounded_timeout_marker.py's EXEMPT_RUN_STEPS, and
      # tests/test_ci_dev_layout_matrix_guard.py requires both heavy jobs to
      # keep it ahead of their checkout.
      #
      # Task 012 (requirement I, branch b): the containerized docker-tier
      # experiment (b1f3fb80..8daf54f8, since reverted) ran this whole job
      # as container-root for ~11h across many commits, so EVERY file its
      # steps touched in this reused checkout -- `.git/objects` included,
      # not only `.docker-e2e-tmp-*` sibling-test litter -- landed
      # root-owned on this self-hosted runner's real disk. A host-run job's
      # own unprivileged user can then neither clean nor overwrite them, so
      # `actions/checkout` itself failed (heavy run 35207813022, docker-tier
      # job 105157778298: `EACCES: permission denied, unlink
      # '.../.git/objects/10/a61deb98...'`) -- the SAME failure mode B's own
      # comment above already describes for `record`, just spread over the
      # whole tree instead of one directory. Fixed by chowning the ENTIRE
      # workspace back to the runner's own uid/gid through a disposable root
      # sibling, unconditionally and every run -- idempotent (a no-op on an
      # already-correctly-owned tree) and cheap enough to leave as a
      # permanent safety net rather than something removed once this one
      # incident is cleared, since a future root-run step anywhere could
      # leave the same kind of litter again.
      - name: Reap root-owned test litter left in the runner workspace
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          mkdir -p "$ws"
          # The image container/Dockerfile is FROM: present on this box from
          # every docker-tier run, and pinned by tag rather than pulled blind.
          image=python:3.12-slim-bookworm
          docker image inspect "$image" >/dev/null 2>&1 || docker pull -q "$image"
          docker run --rm --user 0:0 -v "$ws":/reap "$image" \
            sh -c "chown -R $(id -u):$(id -g) /reap"
          if ! ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "no .docker-e2e-tmp-* litter in $ws"
            exit 0
          fi
          ls -d "$ws"/.docker-e2e-tmp-*
          docker run --rm --user 0:0 -v "$ws":/reap "$image" \
            sh -c 'cd /reap && rm -rf .docker-e2e-tmp-*'
          if ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "litter survived the reap -- checkout will fail" >&2
            exit 1
          fi
          echo "reaped"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Wrapped in scripts/run_bounded.sh (task 054, K.3) like the tier step
      # below: an inner bound makes an overrun an ordinary step `failure`
      # carrying the RALPHD_TIMEOUT_KILL marker instead of the job-level
      # bound's ambiguous `cancelled`.
      - name: Build a clean venv
        run: |
          scripts/run_bounded.sh 600 "venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -e ".[dev]"
            .venv/bin/python -V
          '

      - name: Report the environment
        run: |
          echo "cores: $(nproc)  mem: $(free -m | awk '/^Mem/{print $2}') MB  swap: $(free -m | awk '/^Swap/{print $2}') MB"
          docker version --format 'docker client={{.Client.Version}} server={{.Server.Version}}'
          df -h / | tail -1

      # Serial on purpose for the first measured run: these 24 tests build real
      # images and run real containers on a 4-core / 7 GB box. Once we have a
      # number, `-n 2 --dist loadfile` is the next thing to try.
      #
      # Bounded at 6000s (task 054, K.3): with the venv build's 600 that is
      # 110 of this job's 120 `timeout-minutes`, leaving the 10-minute
      # reserve tests/test_run_bounded_timeout_marker.py requires for the
      # steps no wrapper owns (checkout, the environment report, the image
      # cleanup). A docker-tier hang -- an image build stalled on a registry,
      # a container that never exits -- now ends as a step `failure` naming
      # itself, not as a `cancelled` indistinguishable from the push
      # collapse this workflow does on purpose.
      - name: Docker tier
        run: scripts/run_bounded.sh 6000 "docker tier" -- .venv/bin/python -m pytest -q -m docker --durations=15 --alluredir=allure-results-docker

      # The Allure results of this tier (docs/testing.md, "Allure results"),
      # kept even when the tier is red. The name carries the tier and the run
      # id (and the attempt, so a rerun does not collide with attempt 1).
      - name: Upload the docker tier's Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-docker-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-results-docker
          if-no-files-found: error
          retention-days: 14

      # Exact tags only -- never a wildcard or label filter (see the repo's
      # cleanup discipline: a ralphd host runs other people's containers).
      # `|| true` because a green tier is expected to have removed them itself;
      # this is the belt for a red one.
      - name: Remove this run's test images
        if: always()
        run: |
          docker image rm -f "ralphd:test-${RALPHD_RUN_ID}" || true
          docker image rm -f "ralphd:test-${RALPHD_RUN_ID}-base" || true
          df -h / | tail -1

      # Task 054 (K.3), the classifier half: runs even on a cancelled job. It
      # prints RALPHD_TIMEOUT_KILL only when a bounded step above recorded a
      # real wall-clock expiry, and RALPHD_CANCEL_NOT_TIMEOUT when this job's
      # status is `cancelled` with no such record. Always exits 0, so
      # it can never change this tier's outcome.
      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 120 "ci docker tier" "${{ job.status }}"

  # The browser tier (moved from heavy.yml's `browser-tier`; the steps are
  # unchanged). `playwright-cli` and real Google Chrome come from the pinned
  # image below, never from the runner. The image is published by
  # `.github/workflows/browser-image.yml` (a deliberate dispatch, never a side
  # effect of a push or a pull request); nothing in THIS file builds it, and
  # a new digest is pinned here in a commit of its own. A tag can be repointed
  # on the registry side, a digest cannot.
  #
  # `credentials:` plus `packages: read`, rather than an unauthenticated pull:
  # GHCR has no API that makes a package public, so the package is private. It
  # is readable by this job's own `GITHUB_TOKEN` because a workflow of THIS
  # repository published it, which links the package to the repository.
  #
  # `docker-host` because the runner starts the `container:` itself;
  # `browser-runner` because the tier drives real browser sessions.
  browser:
    name: browser tier
    needs: trusted
    if: needs.trusted.outputs.trusted == 'true'
    runs-on: [self-hosted, linux, x64, ci-pool, docker-host, browser-runner]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/n-orlov/ralphd-browser-ci@sha256:2311f2f375f35762e57de5c564c43b30cd5fe7cf7dae9e991370a05100596b7c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Task 054 (K.3): see the docker tier's copy of this step above.
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=60" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      # Task 004 (requirement B, #202): the docker tier's copy of this step
      # above carries the full rationale. It is needed here too because the
      # litter is per RUNNER WORKSPACE, not per job: each of the four eligible
      # slots (`int21h-ws-1`..`int21h-ws-4`, corrected from the retired VPS's
      # two slots by task 014, requirement K) keeps its own checkout, the
      # docker tier poisons whichever one it landed on, and the browser tier's
      # own checkout then dies in exactly the same way on that workspace next
      # time it is scheduled there.
      #
      # Task 011 (requirement H): unlike the docker tier above, this job now
      # declares `container:`, so every step -- this one included, it is the
      # very first -- already runs as the pinned image's own default user,
      # which is root (verified: `id` inside `mcr.microsoft.com/playwright`
      # prints `uid=0`). There is no unprivileged-runner problem left to
      # solve with a nested `docker run --user 0:0`, and no `docker` client
      # even ships in this image, so a plain `rm -rf` is both sufficient and
      # correct here -- the nested-container form stays only where the job
      # (docker-tier, still uncontainerized until task 012) actually runs
      # unprivileged on the bare runner.
      - name: Reap root-owned test litter left in the runner workspace
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          mkdir -p "$ws"
          if ! ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "no .docker-e2e-tmp-* litter in $ws"
            exit 0
          fi
          ls -d "$ws"/.docker-e2e-tmp-*
          rm -rf "$ws"/.docker-e2e-tmp-*
          if ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "litter survived the reap -- checkout will fail" >&2
            exit 1
          fi
          echo "reaped"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Bounded like every other wall-clock-consuming step here (task 054,
      # K.3). No apt install of its own any more (task 011): the pinned image
      # ships `python3.12-venv` -- the base does not, and `python3 -m venv`
      # fails there with "ensurepip is not available" -- so this step is back
      # to being a plain venv build against the image's own interpreter.
      - name: Build a clean venv
        run: |
          scripts/run_bounded.sh 600 "venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -e ".[dev]"
          '

      # Task 011 (requirement H): NOT a toolchain install -- `playwright-cli`
      # and Chrome come from the image (see `container:` above) -- but a launch
      # option that has to live in the checked-out workspace, because that is
      # where playwright-cli reads it from. Launching real Chrome as the
      # container's root user needs its own PID/user namespace, which this
      # container's seccomp profile refuses ("Running as root without
      # --no-sandbox is not supported"); the tier itself runs as a non-root
      # account below and would not need it, but the config has to exist before
      # that switch and does no harm being present at all times -- verified
      # end-to-end against this image before committing it. Exempt from the
      # inner-bound wrapper (tests/test_run_bounded_timeout_marker.py's
      # EXEMPT_RUN_STEPS): one `mkdir` and one `printf` against local state.
      - name: Configure Chrome's launch options for this container
        run: |
          mkdir -p .playwright
          printf %s "{\"browser\":{\"launchOptions\":{\"args\":[\"--no-sandbox\"]}}}" \
            > .playwright/cli.config.json
          cat .playwright/cli.config.json

      # The module skips itself when `playwright-cli` is absent
      # (tests/test_browser_hub.py: `shutil.which("playwright-cli")`), so a
      # broken toolchain would silently produce a green lane with skips
      # instead of a failure. Fail here instead, loudly, before the tier
      # runs. Task 011 (requirement H, H.2): the versions this prints are the
      # PINNED IMAGE's -- nothing in this job installs either tool, and
      # nothing here can see the runner host's own provisioning any more.
      - name: Assert the browser toolchain is present
        run: |
          echo "container image: ghcr.io/n-orlov/ralphd-browser-ci@sha256:2311f2f375f35762e57de5c564c43b30cd5fe7cf7dae9e991370a05100596b7c"
          command -v playwright-cli
          playwright-cli --version
          command -v google-chrome
          google-chrome --version
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-<unset>}"

      # Task 011 (requirement H) fallout, the same shape gate.yml's `fast`
      # job uses (task 009, requirement F): give the browser tier a real,
      # non-root process uid before it runs -- launching real Chrome as this
      # container's root default user fails even with the sandbox config
      # above (a second, independent root restriction: "Failed to move to
      # new namespace ... Operation not permitted", verified against this
      # exact image). `ubuntu` is this image's own preexisting uid-1000
      # account (its base is `ubuntu:24.04`, which ships one) -- no `useradd`
      # needed, unlike gate.yml's python-slim image which has none. The
      # `chown` hands this job's own checkout, its timeout-evidence
      # directory and `$HOME` (GitHub's own per-job bind mount, never the
      # runner service account's real home -- see gate.yml's `container:`
      # comment for why that distinction matters) to that account. Exempt
      # from the inner-bound wrapper (tests/test_run_bounded_timeout_marker.
      # py's EXEMPT_RUN_STEPS): local, no network fetch, a handful of
      # seconds even over this tree, same shape as gate.yml's own copy.
      - name: Prepare the browser tier's non-root account
        run: |
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE" "$RALPHD_TIMEOUT_EVIDENCE_DIR" "$HOME"

      # Bounded at 2400s (task 054, K.3): with the venv build's 600 and the
      # playwright-cli/Chrome install's 300 that is 55 of this job's 60
      # `timeout-minutes`, leaving the 300s reserve
      # tests/test_run_bounded_timeout_marker.py's JOB_RESERVE_S requires for
      # the steps no wrapper owns (checkout, the toolchain assertion, the
      # account switch, the session cleanup). #193's Chrome session drop is
      # exactly the failure mode that can leave a playwright-cli call
      # waiting on a dead session, and a job that dies that way used to be
      # indistinguishable from this workflow's own push collapse.
      #
      # `su -p ubuntu -c '...'` (task 011, same shape as gate.yml's `su -p
      # ci`, task 009): runs the whole recipe -- run_bounded.sh included --
      # as the non-root account the previous step prepared, `-p` so
      # `$RALPHD_JOB_STARTED_AT`, `$RALPHD_JOB_BOUND_MINUTES`,
      # `$RALPHD_TIMEOUT_EVIDENCE_DIR` and `$HOME` all survive the user
      # switch -- verified directly (a disposable container, same image,
      # same `su -p` invocation, full 60-test browser marker green) before
      # trusting it here. `su` without `-l` keeps the caller's cwd
      # ($GITHUB_WORKSPACE), so no explicit `cd` is needed.
      - name: Browser tier
        run: su -p ubuntu -c 'scripts/run_bounded.sh 2400 "browser tier" -- .venv/bin/python -m pytest -q -m browser --durations=15 --alluredir=allure-results-browser'

      # The Allure results of this tier (docs/testing.md, "Allure results"),
      # kept even when the tier is red. The name carries the tier and the run
      # id (and the attempt, so a rerun does not collide with attempt 1).
      - name: Upload the browser tier's Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-results-browser
          if-no-files-found: error
          retention-days: 14

      # A playwright-cli session is a daemon that outlives a killed pytest.
      # The suite force-closes its own sessions; this catches a cancelled job.
      # Resolve each candidate PID, verify what it is and who owns it, then
      # signal that PID -- never a pattern kill, which is how you take out a
      # process you never meant to touch. This step's own `run:` still
      # executes as the container's root default user (only the tier itself
      # switched to `ubuntu` above), so `mine` is resolved by name rather
      # than by `id -u` of the running step -- root can still signal a
      # uid-1000 daemon it does not own, same as before.
      - name: Close stray browser sessions
        if: always()
        run: |
          mine=$(id -u ubuntu)
          for pid in $(pgrep -u "$mine" -f 'cliDaemon\.js' || true); do
            cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)
            owner=$(stat -c %u "/proc/$pid" 2>/dev/null || true)
            case "$cmd" in
              *cliDaemon.js*)
                if [ "$owner" = "$mine" ]; then
                  echo "closing stray daemon pid=$pid: $cmd"
                  kill "$pid" || true
                fi
                ;;
            esac
          done

      # Task 054 (K.3), the classifier half -- see the docker tier's copy.
      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 60 "ci browser tier" "${{ job.status }}"

  # The single verdict: the check `ci / required`. It is the one job that runs on
  # a GitHub-hosted runner, because a fork pull request must schedule nothing on
  # a self-hosted one (docs/ci.md). It checks nothing out, reads no secret and
  # uses no action, so it holds no code of the head under test. `if: always()`
  # schedules it for every event and lets it report when a tier is red. On a
  # fork pull request every needed job is skipped, so it fails: a fork PR is
  # never green without a maintainer's review. Its script is exercised by
  # tests/test_ci_workflow_guard.py against a table of results.
  required:
    name: required
    needs: [trusted, lint, fast, docker, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          RESULT_TRUSTED: ${{ needs.trusted.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_FAST: ${{ needs.fast.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
          RESULT_BROWSER: ${{ needs.browser.result }}
        run: |
          status=0
          for pair in "trusted=$RESULT_TRUSTED" "lint=$RESULT_LINT" "fast=$RESULT_FAST" "docker=$RESULT_DOCKER" "browser=$RESULT_BROWSER"; do
            echo "${pair%%=*}: ${pair#*=}"
            if [ "${pair#*=}" != "success" ]; then
              status=1
            fi
          done
          exit "$status"
