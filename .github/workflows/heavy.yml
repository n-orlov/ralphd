# The heavy lanes (#113 step 2): the docker tier and the browser tier, on the
# self-hosted runner.
#
# Why self-hosted: both lanes need something a hosted runner cannot give
# cheaply. The docker tier builds the real job image and drives real sibling
# containers over a real socket (tests/test_docker_sibling_e2e.py,
# test_image_real_build.py, test_run_secrets.py,
# test_sibling_cleanup_job_safe.py -- 24 tests); the browser tier drives a real
# Google Chrome through `playwright-cli` (45 tests). On a 4-core hosted runner
# they would also be several times slower than the measured budgets.
#
# Where: `ralphd-vps` is the operator's VPS (4 x86_64 cores, 7 GB + 4 GB swap,
# docker 29.4.0, Chrome installed under /opt/google/chrome with the playwright
# browser cache shared at /opt/ms-playwright). The VPS now carries TWO
# registered runner slots (vmi3245594 and vmi3245594-2, same labels; see
# docs/ci.md) -- so the docker tier and the browser tier below CAN run
# concurrently on this box; nothing here serialises them against each other,
# and they are separate jobs with separate check runs because a red one must
# not cancel the other's evidence, not because the runner forces it. What
# DOES still serialise the browser tier -- globally, across every workflow,
# not just this one -- is the `browser-runner` label on that job below: the
# operator placed it on exactly one of the two runners (task 077, steer 009).
# A `concurrency:` group cannot do this itself; it only serialises within one
# workflow and has no visibility into what else is scheduled on the runner.
# The docker tier stays label-agnostic and can use either slot.
#
# When: on every pull request (these are required checks -- a merge waits for
# them, and auto-merge fires when they go green), and on pushes to main so the
# shipped sha carries its own attestation. The main-branch runs are
# cancel-in-progress under a single group: if several merges land in a row, the
# newest main is the one that gets attested rather than every intermediate sha.
name: heavy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Task 011 (requirement H): the browser tier takes `playwright-cli` and
      # Google Chrome from a pinned image (see `browser-tier`'s `container:`
      # below), and the `browser-image` job at the bottom of this file is what
      # builds and publishes that image from `ci/browser/Dockerfile`. It is
      # OFF unless a dispatch asks for it: republishing is a deliberate act
      # (it produces a new digest that a human then pins below), never a side
      # effect of a push or a pull request. Nothing else in this workflow
      # depends on it -- the tier pulls the digest already published.
      publish_browser_image:
        description: >-
          Rebuild and push the browser tier's pinned image, then print its
          digest to pin in this file. Leave off for an ordinary lane run.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker-tier:
    name: docker tier
    # Task 011 (requirement H): a dispatch that asks for
    # `publish_browser_image` is asking for one thing -- a rebuilt, republished
    # browser image -- and running two 20-to-60-minute tiers alongside it would
    # only add host contention to a job that is network-bound. On a push, a
    # pull request, or any dispatch that leaves the flag off, the input is
    # false/absent and this tier runs exactly as before.
    if: ${{ !inputs.publish_browser_image }}
    runs-on: [self-hosted, linux, x64, ralphd-vps, docker-host]
    timeout-minutes: 120
    concurrency:
      group: heavy-docker-${{ github.event_name == 'push' && 'main' || github.ref }}
      cancel-in-progress: true
    # Task 012 (requirement I.1, #205 step 4): pinned to the SAME digest
    # gate.yml's `fast` job already vetted (task 009, requirement F) --
    # python:3.12.3, Debian 12 "bookworm" (full, not -slim), ships curl+tar
    # for the docker-client fetch below and defaults to uid 0. Left at that
    # default for every step in this job (unlike gate's/browser's non-root
    # switch): the 24 `-m docker` tests never assert THIS job's own process
    # uid, only the uid of the CONTAINERS it builds and drives, and running
    # as root is what lets `docker` reach the mounted socket below with no
    # `--group-add` gymnastics -- root bypasses the socket's `root:docker
    # 0660` DAC check outright (verified directly: a disposable sibling,
    # this same image, `-v /var/run/docker.sock:/var/run/docker.sock`, a
    # `docker run` through it as uid 0 with no group-add, before trusting it
    # here).
    #
    # `options:` mounts the HOST's own docker socket into this job's own
    # container -- the identical `-v /var/run/docker.sock:/var/run/docker.sock`
    # shape `docs/architecture.md`'s `--allow-docker` section documents for
    # the engine's own job containers ("Mechanics"). Containers this job's
    # tests start via that socket are SIBLINGS on the host daemon, exactly as
    # before containerization -- only WHERE the client process issuing
    # `docker run` now lives has changed.
    container:
      image: python:3.12.3@sha256:3966b81808d864099f802080d897cef36c01550472ab3955fdd716d1c665acd6
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      # Per-run image tag isolation: tests/test_docker_sibling_e2e.py builds
      # `ralphd:test-$RALPHD_RUN_ID` (+ `-base`) and labels its siblings
      # `ralphd.run=$RALPHD_RUN_ID`. Without this the whole tier collapses onto
      # the shared `ralphd:test-local-dev` fallback, which is exactly the
      # collision the tag-per-run scheme exists to prevent (F1, #73).
      # tests/conftest.py strips this variable from every spawned engine's
      # environment, so it cannot leak into a child as if this were a job
      # container.
      RALPHD_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Task 012 (requirement I.2): THE HOST-PATH TRANSLATION.
      #
      # GitHub Actions' own self-hosted `container:` runtime bind-mounts
      # `$GITHUB_WORKSPACE` (and `$RUNNER_TEMP`) into a job's container at the
      # SAME ABSOLUTE PATH they hold on the runner host -- this is what makes
      # docker-outside-of-docker work at all for a self-hosted runner with a
      # job container, and it is verified directly below ("Assert this
      # container's workspace path resolves on the real host too") rather
      # than assumed. So the path this job's OWN filesystem calls
      # `$GITHUB_WORKSPACE` IS ALREADY the host's own path -- nothing needs
      # rewriting, only naming: this is the exact `RALPHD_HOST_WORKSPACE`
      # variable `ralphctl start --allow-docker` injects for the identical
      # reason (docs/architecture.md, "Path translation gotcha"), and
      # `tests/test_docker_sibling_e2e.py::_host_path` /
      # `tests/test_run_secrets.py`'s `HOST_WORKSPACE` already read it and
      # degrade to a no-op when it is unset -- unset is what a bare,
      # uncontainerized runner needed; set is what THIS container needs.
      RALPHD_HOST_WORKSPACE: ${{ github.workspace }}
    steps:
      # Task 054 (K.3): stamp this job's start, its declared bound and a fresh
      # per-job evidence directory, so the classifier step at the end can tell
      # a `timeout-minutes` kill from a human cancel and from
      # this job's own `cancel-in-progress` supersession -- which, on this
      # workflow, is a routine event (pushes collapse onto one group), so
      # `cancelled` here is even more overloaded than on gate. See
      # scripts/job_timeout_marker.sh's header.
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=120" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      # Task 004 (requirement B, #202): reap root-owned test litter BEFORE
      # `actions/checkout` runs, because a poisoned workspace kills this job
      # IN CHECKOUT, before any step of ours could clean it.
      #
      # The docker tier's throwaway registry has to live inside this very
      # checkout for the sibling bind-mount hostpath translation to work, and
      # every run of it writes `configs/<run-id>/record/` -- the authoritative
      # task record, root-owned inside a root-owned 0700 directory, which is
      # exactly the property requirement B asks for. A test whose container is
      # hard-killed (`docker rm -f`) instead of stopped gracefully never runs
      # the engine's `privsep.release_protected_tasks_dir` funnel, so that
      # directory stays root-owned: `git clean -ffdx` cannot remove it, the
      # runner then declares the workspace unclean, tries to recreate it and
      # dies with `EACCES: permission denied, scandir '.../record'` (heavy
      # 35108739999 and 35108738499, both jobs, runner workspaces ws-2 and
      # ws-3). A self-hosted runner reuses its workspace, so the litter is
      # permanent until something with root removes it -- and the only root
      # available on this box is a container's.
      #
      # `tests/test_docker_sibling_e2e.py` reaps its own litter at teardown
      # and sweeps stale litter before its first build; this step is the belt
      # for the case those cannot cover at all -- a tier killed by a
      # `timeout-minutes` bound or a `cancel-in-progress` supersession, whose
      # fixtures never get to run. It is deliberately NOT wrapped in
      # scripts/run_bounded.sh: `scripts/` does not exist yet at this point in
      # the job (nothing is checked out), and the step is a local `rm -rf` of
      # at most a handful of directories. It is listed for exactly that reason
      # in tests/test_run_bounded_timeout_marker.py's EXEMPT_RUN_STEPS, and
      # tests/test_ci_dev_layout_matrix_guard.py requires both heavy jobs to
      # keep it ahead of their checkout.
      #
      # Task 012 (requirement I): now a PLAIN `rm -rf`, no nested
      # `docker run --user 0:0` needed any more -- this job's own default
      # user already IS root (the `container:` above), same simplification
      # task 011 already made for browser-tier once IT containerized
      # (`tests/test_ci_dev_layout_matrix_guard.py::check_heavy_litter_reap`
      # accepts a bare `rm -rf` once `"container" in job`).
      - name: Reap root-owned test litter left in the runner workspace
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          mkdir -p "$ws"
          if ! ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "no .docker-e2e-tmp-* litter in $ws"
            exit 0
          fi
          ls -d "$ws"/.docker-e2e-tmp-*
          rm -rf "$ws"/.docker-e2e-tmp-*
          if ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "litter survived the reap -- checkout will fail" >&2
            exit 1
          fi
          echo "reaped"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Task 012 (requirement I.1): the docker CLIENT this job's tests and its
      # own later steps need to reach the socket `options:` above mounted --
      # the base image ships neither. Static, pinned binary: the identical
      # recipe and version `container/Dockerfile` already uses for the
      # engine's own image, so no apt/network-repo dependency and no version
      # drift between the two. Wrapped like every other post-checkout step.
      - name: Install the docker client for this pinned container
        run: |
          scripts/run_bounded.sh 90 "docker client install" -- bash -euo pipefail -c '
            curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz" \
              | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
            docker --version
          '

      # Task 012 (requirement I.2): PROVE the translation stated on `env:`
      # above rather than assume it -- a throwaway sibling mounts
      # `$GITHUB_WORKSPACE` (this job's own env, unmodified) through the
      # socket and must see the real checkout, not an empty directory a
      # wrong path would silently create.
      - name: Assert this container's workspace path resolves on the real host too
        run: |
          scripts/run_bounded.sh 30 "host-path assertion" -- bash -euo pipefail -c '
            docker run --rm -v "$GITHUB_WORKSPACE":/check:ro \
              python:3.12.3@sha256:3966b81808d864099f802080d897cef36c01550472ab3955fdd716d1c665acd6 \
              sh -c "test -f /check/pyproject.toml && echo host-path-confirmed: pyproject.toml visible through the socket-mounted path"
          '

      # Wrapped in scripts/run_bounded.sh (task 054, K.3) like the tier step
      # below: an inner bound makes an overrun an ordinary step `failure`
      # carrying the RALPHD_TIMEOUT_KILL marker instead of the job-level
      # bound's ambiguous `cancelled`.
      - name: Build a clean venv
        run: |
          scripts/run_bounded.sh 600 "venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -e ".[dev]"
            .venv/bin/python -V
          '

      - name: Report the environment
        run: |
          echo "cores: $(nproc)  mem: $(free -m | awk '/^Mem/{print $2}') MB  swap: $(free -m | awk '/^Swap/{print $2}') MB"
          docker version --format 'docker client={{.Client.Version}} server={{.Server.Version}}'
          df -h / | tail -1

      # Serial on purpose for the first measured run: these 24 tests build real
      # images and run real containers on a 4-core / 7 GB box. Once we have a
      # number, `-n 2 --dist loadfile` is the next thing to try.
      #
      # Bounded at 6000s (task 054, K.3): with the venv build's 600, the
      # docker-client install's 90 and the host-path assertion's 30 (task
      # 012, requirement I) that is 6720 of this job's 7200s `timeout-minutes`
      # budget, leaving the reserve tests/test_run_bounded_timeout_marker.py
      # requires for the steps no wrapper owns (checkout, the environment
      # report, the image cleanup). A docker-tier hang -- an image build
      # stalled on a registry, a container that never exits -- now ends as a
      # step `failure` naming itself, not as a `cancelled` indistinguishable
      # from the push collapse this workflow does on purpose.
      - name: Docker tier
        run: scripts/run_bounded.sh 6000 "docker tier" -- .venv/bin/python -m pytest -q -m docker --durations=15

      # Exact tags only -- never a wildcard or label filter (see the repo's
      # cleanup discipline: a ralphd host runs other people's containers).
      # `|| true` because a green tier is expected to have removed them itself;
      # this is the belt for a red one.
      - name: Remove this run's test images
        if: always()
        run: |
          docker image rm -f "ralphd:test-${RALPHD_RUN_ID}" || true
          docker image rm -f "ralphd:test-${RALPHD_RUN_ID}-base" || true
          df -h / | tail -1

      # Task 054 (K.3), the classifier half: runs even on a cancelled job. It
      # prints RALPHD_TIMEOUT_KILL only when a bounded step above recorded a
      # real wall-clock expiry, and RALPHD_CANCEL_NOT_TIMEOUT when this job's
      # status is `cancelled` with no such record. Always exits 0, so
      # it can never change this tier's outcome.
      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 120 "heavy docker tier" "${{ job.status }}"

  browser-tier:
    name: browser tier
    # Task 011 (requirement H): see the docker tier's copy of this condition --
    # a publish-only dispatch runs the publisher alone.
    if: ${{ !inputs.publish_browser_image }}
    # `browser-runner` (task 077, steer 009): the operator placed this label
    # on exactly ONE of the VPS's two runner slots (vmi3245594; not
    # vmi3245594-2). It is not guessable from this workflow alone, so: the
    # browser tier drives real `playwright-cli` sessions against real Chrome
    # on a 4-core host, two concurrent browser-bearing jobs collapse each
    # other's sessions, and this label is the ONLY mechanism that serialises
    # browser work across *workflows* -- a `concurrency:` group serialises
    # only within one workflow and cannot see what else is running on the
    # runner. Nothing else takes this label: the docker tier above and every
    # `nightly.yml` matrix cell stay label-agnostic and keep both slots.
    # Still self-hosted for that placement/serialisation reason -- `runs-on`
    # is unchanged below -- but as of task 011 (requirement H, #205 step 3)
    # this job ALSO declares `container:`, so the runner's own ambient
    # provisioning (docs/ci.md's "Provisioned with ... Google Chrome ...
    # shared browser cache") is no longer this tier's subject: Chrome comes
    # from the pinned image below, at a version this job's own log names,
    # not from whatever the runner host happens to have installed. That
    # ambient provisioning drifted once already (the VPS-to-workstation
    # move silently lost python3.12.3, #205's own motivation for F) and
    # nothing stopped it drifting here the same way.
    runs-on: [self-hosted, linux, x64, ralphd-vps, docker-host, browser-runner]
    timeout-minutes: 60
    concurrency:
      group: heavy-browser-${{ github.event_name == 'push' && 'main' || github.ref }}
      cancel-in-progress: true
    # Pinned by digest (H.1): a tag can be repointed on the registry side, a
    # digest cannot. This is the image the `browser-image` job at the bottom of
    # this file builds from `ci/browser/Dockerfile` and pushes -- and it, not a
    # job step, is where `playwright-cli` and real Google Chrome come from:
    # playwright-cli 0.1.19 and Google Chrome 153.0.8010.47, printed by that
    # publishing job from inside this very digest (run 35155997945) and
    # re-printed by this job's own toolchain assertion step below (H.2). The
    # base it is built FROM, `mcr.microsoft.com/playwright:v1.62.1-noble`,
    # supplies Node 22, git, a uid-1000 `ubuntu` account and Chrome's system
    # dependencies, but neither `@playwright/cli` nor real Chrome (only
    # playwright-managed Chromium) -- which is why an image of our own exists.
    #
    # `credentials:` plus `packages: read`, rather than an unauthenticated
    # pull: GHCR has no API that makes a package public (only its web UI does,
    # the same wall task 009's gate.yml header hit), so the package is private.
    # It is readable by this job's own `GITHUB_TOKEN` because a workflow of
    # THIS repository published it, which links the package to the repository;
    # a hand-push with a personal access token does not, and its digest answers
    # `manifest unknown` to that token (measured -- see the `browser-image`
    # job's header at the bottom of this file).
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/n-orlov/ralphd-browser-ci@sha256:d760ffa130f503b19c7c260f3840222504ba7baa7fa172a76dbc0652a119b0c9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Task 054 (K.3): see the docker tier's copy of this step above.
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=60" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      # Task 004 (requirement B, #202): the docker tier's copy of this step
      # above carries the full rationale. It is needed here too because the
      # litter is per RUNNER WORKSPACE, not per job: the two runner slots keep
      # separate checkouts (ws-2, ws-3), the docker tier poisons whichever one
      # it landed on, and the browser tier's own checkout then dies in exactly
      # the same way on that workspace next time it is scheduled there.
      #
      # Task 011 (requirement H): unlike the docker tier above, this job now
      # declares `container:`, so every step -- this one included, it is the
      # very first -- already runs as the pinned image's own default user,
      # which is root (verified: `id` inside `mcr.microsoft.com/playwright`
      # prints `uid=0`). There is no unprivileged-runner problem left to
      # solve with a nested `docker run --user 0:0`, and no `docker` client
      # even ships in this image, so a plain `rm -rf` is both sufficient and
      # correct here -- the nested-container form stays only where the job
      # (docker-tier, still uncontainerized until task 012) actually runs
      # unprivileged on the bare runner.
      - name: Reap root-owned test litter left in the runner workspace
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          mkdir -p "$ws"
          if ! ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "no .docker-e2e-tmp-* litter in $ws"
            exit 0
          fi
          ls -d "$ws"/.docker-e2e-tmp-*
          rm -rf "$ws"/.docker-e2e-tmp-*
          if ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "litter survived the reap -- checkout will fail" >&2
            exit 1
          fi
          echo "reaped"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Bounded like every other wall-clock-consuming step here (task 054,
      # K.3). No apt install of its own any more (task 011): the pinned image
      # ships `python3.12-venv` -- the base does not, and `python3 -m venv`
      # fails there with "ensurepip is not available" -- so this step is back
      # to being a plain venv build against the image's own interpreter.
      - name: Build a clean venv
        run: |
          scripts/run_bounded.sh 600 "venv build" -- bash -euo pipefail -c '
            rm -rf .venv
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
            .venv/bin/python -m pip install --quiet -e ".[dev]"
          '

      # Task 011 (requirement H): NOT a toolchain install -- `playwright-cli`
      # and Chrome come from the image (see `container:` above) -- but a launch
      # option that has to live in the checked-out workspace, because that is
      # where playwright-cli reads it from. Launching real Chrome as the
      # container's root user needs its own PID/user namespace, which this
      # container's seccomp profile refuses ("Running as root without
      # --no-sandbox is not supported"); the tier itself runs as a non-root
      # account below and would not need it, but the config has to exist before
      # that switch and does no harm being present at all times -- verified
      # end-to-end against this image before committing it. Exempt from the
      # inner-bound wrapper (tests/test_run_bounded_timeout_marker.py's
      # EXEMPT_RUN_STEPS): one `mkdir` and one `printf` against local state.
      - name: Configure Chrome's launch options for this container
        run: |
          mkdir -p .playwright
          printf %s "{\"browser\":{\"launchOptions\":{\"args\":[\"--no-sandbox\"]}}}" \
            > .playwright/cli.config.json
          cat .playwright/cli.config.json

      # The module skips itself when `playwright-cli` is absent
      # (tests/test_browser_hub.py: `shutil.which("playwright-cli")`), so a
      # broken toolchain would silently produce a green lane with skips
      # instead of a failure. Fail here instead, loudly, before the tier
      # runs. Task 011 (requirement H, H.2): the versions this prints are the
      # PINNED IMAGE's -- nothing in this job installs either tool, and
      # nothing here can see the runner host's own provisioning any more.
      - name: Assert the browser toolchain is present
        run: |
          echo "container image: ghcr.io/n-orlov/ralphd-browser-ci@sha256:d760ffa130f503b19c7c260f3840222504ba7baa7fa172a76dbc0652a119b0c9"
          command -v playwright-cli
          playwright-cli --version
          command -v google-chrome
          google-chrome --version
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-<unset>}"

      # Task 011 (requirement H) fallout, the same shape gate.yml's `fast`
      # job uses (task 009, requirement F): give the browser tier a real,
      # non-root process uid before it runs -- launching real Chrome as this
      # container's root default user fails even with the sandbox config
      # above (a second, independent root restriction: "Failed to move to
      # new namespace ... Operation not permitted", verified against this
      # exact image). `ubuntu` is this image's own preexisting uid-1000
      # account (its base is `ubuntu:24.04`, which ships one) -- no `useradd`
      # needed, unlike gate.yml's python-slim image which has none. The
      # `chown` hands this job's own checkout, its timeout-evidence
      # directory and `$HOME` (GitHub's own per-job bind mount, never the
      # runner service account's real home -- see gate.yml's `container:`
      # comment for why that distinction matters) to that account. Exempt
      # from the inner-bound wrapper (tests/test_run_bounded_timeout_marker.
      # py's EXEMPT_RUN_STEPS): local, no network fetch, a handful of
      # seconds even over this tree, same shape as gate.yml's own copy.
      - name: Prepare the browser tier's non-root account
        run: |
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE" "$RALPHD_TIMEOUT_EVIDENCE_DIR" "$HOME"

      # Bounded at 2400s (task 054, K.3): with the venv build's 600 and the
      # playwright-cli/Chrome install's 300 that is 55 of this job's 60
      # `timeout-minutes`, leaving the 300s reserve
      # tests/test_run_bounded_timeout_marker.py's JOB_RESERVE_S requires for
      # the steps no wrapper owns (checkout, the toolchain assertion, the
      # account switch, the session cleanup). #193's Chrome session drop is
      # exactly the failure mode that can leave a playwright-cli call
      # waiting on a dead session, and a job that dies that way used to be
      # indistinguishable from this workflow's own push collapse.
      #
      # `su -p ubuntu -c '...'` (task 011, same shape as gate.yml's `su -p
      # ci`, task 009): runs the whole recipe -- run_bounded.sh included --
      # as the non-root account the previous step prepared, `-p` so
      # `$RALPHD_JOB_STARTED_AT`, `$RALPHD_JOB_BOUND_MINUTES`,
      # `$RALPHD_TIMEOUT_EVIDENCE_DIR` and `$HOME` all survive the user
      # switch -- verified directly (a disposable container, same image,
      # same `su -p` invocation, full 60-test browser marker green) before
      # trusting it here. `su` without `-l` keeps the caller's cwd
      # ($GITHUB_WORKSPACE), so no explicit `cd` is needed.
      - name: Browser tier
        run: su -p ubuntu -c 'scripts/run_bounded.sh 2400 "browser tier" -- .venv/bin/python -m pytest -q -m browser --durations=15'

      # A playwright-cli session is a daemon that outlives a killed pytest.
      # The suite force-closes its own sessions; this catches a cancelled job.
      # Resolve each candidate PID, verify what it is and who owns it, then
      # signal that PID -- never a pattern kill, which is how you take out a
      # process you never meant to touch. This step's own `run:` still
      # executes as the container's root default user (only the tier itself
      # switched to `ubuntu` above), so `mine` is resolved by name rather
      # than by `id -u` of the running step -- root can still signal a
      # uid-1000 daemon it does not own, same as before.
      - name: Close stray browser sessions
        if: always()
        run: |
          mine=$(id -u ubuntu)
          for pid in $(pgrep -u "$mine" -f 'cliDaemon\.js' || true); do
            cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)
            owner=$(stat -c %u "/proc/$pid" 2>/dev/null || true)
            case "$cmd" in
              *cliDaemon.js*)
                if [ "$owner" = "$mine" ]; then
                  echo "closing stray daemon pid=$pid: $cmd"
                  kill "$pid" || true
                fi
                ;;
            esac
          done

      # Task 054 (K.3), the classifier half -- see the docker tier's copy.
      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 60 "heavy browser tier" "${{ job.status }}"

  # Task 011 (requirement H, #205 step 3): the publisher of the image the
  # browser tier above pins.
  #
  # Why it exists at all: H.1 wants the tier's `playwright-cli` and Chrome to
  # come from the image, and no public image supplies that pair --
  # `mcr.microsoft.com/playwright` brings Chrome's system dependencies and
  # playwright's own Chromium, not `@playwright/cli` and not real Google
  # Chrome (verified against the digest `ci/browser/Dockerfile` builds FROM).
  # So the pair has to come from an image this repository builds. And it has
  # to be published from HERE, by this job, rather than pushed by hand from a
  # workstation: a GHCR package pushed with a personal access token is
  # private, is linked to no repository, and `${{ secrets.GITHUB_TOKEN }}`
  # cannot read it (measured: `docker login` succeeds and `docker manifest
  # inspect` then answers `manifest unknown`), while a package published by a
  # workflow of this repository is linked to it and readable by that same
  # token. GHCR has no API that makes a package public -- only its web UI
  # does, which is why `browser-tier` above pulls with `credentials:`.
  #
  # It runs only on an explicit `workflow_dispatch` with
  # `publish_browser_image: true`, so an ordinary push/PR run of this workflow
  # neither builds nor pushes anything. Publishing prints the new digest; a
  # human then pins that digest in `browser-tier`'s `container:` above in a
  # commit of its own. The image is NOT resolved by tag anywhere: a tag can be
  # repointed on the registry side, a digest cannot.
  browser-image:
    name: publish the browser tier's image
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && inputs.publish_browser_image }}
    # Label-agnostic on purpose (either slot will do) and deliberately WITHOUT
    # `browser-runner`: this job runs no browser, and taking that label would
    # serialise it against the tier for no reason.
    runs-on: [self-hosted, linux, x64, ralphd-vps, docker-host]
    timeout-minutes: 40
    concurrency:
      group: heavy-browser-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # The one job in this repository that writes a package. `browser-tier`
      # above needs only `packages: read`.
      packages: write
    steps:
      # Task 054 (K.3): see the docker tier's copy of this step.
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=40" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      # Task 004 (requirement B, #202): same reason and same nested-root shape
      # as the docker tier's copy -- this job is NOT containerized (see the
      # allowlist entry in tests/test_ci_dev_layout_matrix_guard.py), it runs
      # unprivileged on the bare runner, and it shares the runner workspace
      # the docker tier can poison. Its checkout dies exactly the same way
      # without this step.
      - name: Reap root-owned test litter left in the runner workspace
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          mkdir -p "$ws"
          if ! ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "no .docker-e2e-tmp-* litter in $ws"
            exit 0
          fi
          ls -d "$ws"/.docker-e2e-tmp-*
          image=python:3.12-slim-bookworm
          docker image inspect "$image" >/dev/null 2>&1 || docker pull -q "$image"
          docker run --rm --user 0:0 -v "$ws":/reap "$image" \
            sh -c 'cd /reap && rm -rf .docker-e2e-tmp-*'
          if ls -d "$ws"/.docker-e2e-tmp-* >/dev/null 2>&1; then
            echo "litter survived the reap -- checkout will fail" >&2
            exit 1
          fi
          echo "reaped"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bounded at 1800s (task 054, K.3): a build that stalls on npm, on apt or
      # on Chrome's download, and a push that stalls on the registry, are all
      # wall-clock hangs, and 1800 + the 300s JOB_RESERVE_S sits inside this
      # job's 40 `timeout-minutes`. The digest this prints is the whole output
      # of the job: `RepoDigests` is read back from the daemon AFTER the push,
      # so it is the registry's own answer, not a locally computed guess.
      - name: Build and publish the browser tier's pinned image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/run_bounded.sh 1800 "browser image build and push" -- bash -euo pipefail -c '
            image=ghcr.io/n-orlov/ralphd-browser-ci
            tag=pw1.62.1-noble-cli0.1.19
            trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            printf %s "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker build -t "$image:$tag" ci/browser
            docker push "$image:$tag"
            echo "PUBLISHED IMAGE DIGEST (pin this in browser-tier above):"
            docker image inspect --format "{{range .RepoDigests}}{{println .}}{{end}}" "$image:$tag"
            docker run --rm "$image:$tag" sh -c "playwright-cli --version; google-chrome --version"
          '

      # Task 054 (K.3), the classifier half -- see the docker tier's copy.
      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 40 "heavy browser image publish" "${{ job.status }}"
