# The nightly lane (#113 step 2): the dev-layout container matrix (task 077,
# steer 008 task A, replacing the two bare-host jobs task 076 preceded).
#
# `scripts/host_like_dev_layout.sh` reproduces a developer host's install
# layout and dotfiles that the job container's own system-wide install hides
# (see that script's own header): a PEP 668 "externally managed" system
# `pip`, console scripts landing in a user base that is off PATH by default,
# and (in `unset` mode) `$HOME` alone deciding the pytest subprocess's import
# path. Every defect this lane has ever found is a property of the
# ENVIRONMENT, never of bare metal (notes.md rule 11, steer 008, backed by
# the operator's own measurements): task 066's PEP 668 branch is the
# distro's stdlib layout, task 068's unfindable console scripts are the
# ABSENCE of a system-wide ralphd, and #182's dropped trailing positional is
# the interpreter's patch level. A bare-host lane also cannot be scheduled
# reliably -- the `0 2 * * *` cron already fired five hours late once, into
# a push burst. So this lane runs each claim inside a pinned, disposable
# container instead of on whatever the runner's own OS happens to be today.
#
# Six cells cross three PLAIN UPSTREAM IMAGES, EACH WITH NO RALPHD INSTALLED
# AND NEVER THIS JOB'S OWN CONTAINER IMAGE, against the two
# HOST_LIKE_DEV_LAYOUT_PYTHONUSERBASE_MODE values that script documents:
#   ubuntu:24.04       -- 3.12.3, apt's stdlib layout, carries the PEP 668
#                          EXTERNALLY-MANAGED marker (task 066's branch)
#   python:3.11-slim   -- 3.11.x, the floor of this project's own
#                          requires-python
#   python:3.14-slim   -- 3.14.x, the operator's own workstation runtime
# "No ralphd on the image" is a property this lane DEPENDS on: a system-wide
# ralphd is exactly what hid task 068's console-script PATH defect from this
# lane for its whole history, by satisfying the console-script search a
# different way than the user-base install this lane exists to exercise.
#
# Each cell's own `pytest` invocation runs the `fast` tier by default (task
# 076's HOST_LIKE_DEV_LAYOUT_TIER, left at its default here) rather than the
# whole suite unfiltered -- see that script's header and docs/testing.md's
# two retired dev-layout rows for the unfiltered measurement this replaces.
# The content `-m fast` drops relative to unfiltered -- the `docker` and
# `browser` tiers -- is already run at the gate-blocking level by
# `.github/workflows/heavy.yml` and does not vary with the interpreter or
# libc a dev-layout cell is exercising, so no cell loses coverage that
# varies with the axis under test. `-m fast` also excludes `-m browser`
# (tests/conftest.py never stamps a browser-marked node `fast`), which is
# the second, independent reason no matrix cell here ever drives a browser
# (steer 009) -- see the `browser-runner` label on heavy.yml's browser tier,
# the only mechanism that keeps browser work serial across workflows.
#
# Checkout happens on the HOST (`fetch-depth: 0`, so the records lint sees
# real git history and no image needs git installed), then the checkout is
# mounted READ-ONLY at /src-ro inside the container and `cp -a`'d (preserving
# .git) to a container-local /src before anything installs or builds -- a
# root-in-container process must never write into $GITHUB_WORKSPACE, or the
# runner's NEXT checkout fails on root-owned *.egg-info/.pytest_cache left
# behind. This deliberately does NOT use GitHub's own `container:` job key,
# which mounts the checkout writable and would reintroduce exactly that
# hazard.
#
# NOTE: `schedule` only fires on the repository's default branch, so this
# workflow does nothing until it is merged to main. Use `workflow_dispatch` to
# exercise it from a branch.
name: nightly

on:
  schedule:
    # 02:00 UTC -- the VPS is otherwise idle.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-layout:
    name: dev-layout (${{ matrix.image }}, PYTHONUSERBASE ${{ matrix.mode }})
    runs-on: [self-hosted, linux, x64, ralphd-vps, docker-host]
    timeout-minutes: 60
    strategy:
      # Six independent claims -- one red cell must never cancel another.
      fail-fast: false
      # The VPS carries two registered runner slots (vmi3245594 and
      # vmi3245594-2, same labels; docs/ci.md). The operator measured load
      # 1.92 on 4 cores with two jobs in flight and called that comfortable,
      # not three -- this stops at two, and nothing here proposes raising it.
      max-parallel: 2
      matrix:
        include:
          - image: ubuntu:24.04
            mode: exported
          - image: ubuntu:24.04
            mode: unset
          - image: python:3.11-slim
            mode: exported
          - image: python:3.11-slim
            mode: unset
          - image: python:3.14-slim
            mode: exported
          - image: python:3.14-slim
            mode: unset
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Report the host environment
        run: |
          echo "image: ${{ matrix.image }}  mode: ${{ matrix.mode }}"
          echo "cores: $(nproc)  mem: $(free -m | awk '/^Mem/{print $2}') MB  swap: $(free -m | awk '/^Swap/{print $2}') MB"
          docker version --format 'docker server={{.Server.Version}}'
          df -h / | tail -1

      # Mount the checkout read-only, copy it inside, run the script there.
      # The ubuntu:24.04 cell -- and ONLY that cell -- installs python3 and
      # python3-pip first; the two python:*-slim images already ship both.
      # The one deselected node is the HEAD-relative sweep-sha drift check
      # that cannot hold on any commit but a wave's last one (same reason and
      # same exact node id as gate.yml's own deselect, #174, #113 step 4) --
      # everything else in that module, and the whole `fast` tier besides,
      # runs. Once task 053 retires that guard module this deselect has
      # nothing left to name and is removed in that same task.
      - name: Dev-layout mode (containerized)
        env:
          CELL_IMAGE: ${{ matrix.image }}
          CELL_MODE: ${{ matrix.mode }}
        run: |
          install_step=""
          if [ "$CELL_IMAGE" = "ubuntu:24.04" ]; then
            install_step='apt-get update -qq && apt-get install -y -qq python3 python3-pip >/dev/null'
          fi
          docker run --rm \
            -e HOST_LIKE_DEV_LAYOUT_PYTHONUSERBASE_MODE="$CELL_MODE" \
            -v "$GITHUB_WORKSPACE:/src-ro:ro" \
            "$CELL_IMAGE" bash -c "
              set -euo pipefail
              $install_step
              cp -a /src-ro /src
              cd /src
              scripts/host_like_dev_layout.sh \\
                --deselect 'tests/test_sweep_sha_guard.py::test_every_declared_sweep_sha_is_current_or_discharged'
            "
