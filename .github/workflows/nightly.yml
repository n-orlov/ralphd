# The nightly lane (#113 step 2): the dev-layout container matrix (task 077,
# steer 008 task A, replacing the two bare-host jobs task 076 preceded).
#
# `scripts/host_like_dev_layout.sh` reproduces a developer host's install
# layout and dotfiles that the job container's own system-wide install hides
# (see that script's own header): a PEP 668 "externally managed" system
# `pip`, console scripts landing in a user base that is off PATH by default,
# and (in `unset` mode) `$HOME` alone deciding the pytest subprocess's import
# path. Every defect this lane has ever found is a property of the
# ENVIRONMENT, never of bare metal (notes.md rule 11, steer 008, backed by
# the operator's own measurements): task 066's PEP 668 branch is the
# distro's stdlib layout, task 068's unfindable console scripts are the
# ABSENCE of a system-wide ralphd, and #182's dropped trailing positional is
# the interpreter's patch level. A bare-host lane also cannot be scheduled
# reliably -- the `0 2 * * *` cron already fired five hours late once, into
# a push burst. So this lane runs each claim inside a pinned, disposable
# container instead of on whatever the runner's own OS happens to be today.
#
# Where: every cell runs on the elastic runner pool. The job's `runs-on` is
# `[self-hosted, linux, x64, ci-pool]` plus the `docker-host` capability label
# (the job has a `container:` and issues a nested `docker run` per cell, so
# its runner needs the host docker socket). No cell names a standing
# `int21h-ws-N` slot, `fast-lane` or the retired `ralphd-vps` label. The six
# cells run in parallel, each on its own pool runner; docs/ci.md describes the
# pool and the pip settings below.
#
# Six cells cross three PLAIN UPSTREAM IMAGES, EACH WITH NO RALPHD INSTALLED
# AND NEVER THIS JOB'S OWN CONTAINER IMAGE, against the two
# HOST_LIKE_DEV_LAYOUT_PYTHONUSERBASE_MODE values that script documents:
#   ubuntu:24.04       -- 3.12.3, apt's stdlib layout, carries the PEP 668
#                          EXTERNALLY-MANAGED marker (task 066's branch)
#   python:3.11-slim   -- 3.11.x, the floor of this project's own
#                          requires-python
#   python:3.14-slim   -- 3.14.x, the operator's own workstation runtime
# "No ralphd on the image" is a property this lane DEPENDS on: a system-wide
# ralphd is exactly what hid task 068's console-script PATH defect from this
# lane for its whole history, by satisfying the console-script search a
# different way than the user-base install this lane exists to exercise.
#
# Each cell's own `pytest` invocation runs the `fast` tier by default (task
# 076's HOST_LIKE_DEV_LAYOUT_TIER, left at its default here) rather than the
# whole suite unfiltered -- see that script's header and docs/testing.md's
# two retired dev-layout rows for the unfiltered measurement this replaces.
# The content `-m fast` drops relative to unfiltered -- the `docker` and
# `browser` tiers -- is already run at the gate-blocking level by
# `.github/workflows/ci.yml` and does not vary with the interpreter or
# libc a dev-layout cell is exercising, so no cell loses coverage that
# varies with the axis under test. `-m fast` also excludes `-m browser`
# (tests/conftest.py never stamps a browser-marked node `fast`), which is
# the second, independent reason no matrix cell here ever drives a browser
# (steer 009).
#
# Checkout happens on the HOST (`fetch-depth: 0`), then the checkout is
# mounted READ-ONLY at /src-ro inside the NESTED per-cell container and
# `cp -a`'d (preserving .git) to a container-local /src before anything
# installs or builds -- a root-in-CELL process must never write into
# `$GITHUB_WORKSPACE`, or the runner's NEXT checkout fails on root-owned
# `*.egg-info`/`.pytest_cache` left behind.
#
# Task 012 (requirement I): the OUTER job now DOES declare its own pinned
# `container:` (I.1: "both jobs run in pinned containers") -- an earlier
# version of this comment said the opposite ("deliberately does NOT use
# GitHub's own `container:` job key"), reasoning that it mounts the checkout
# writable and would reintroduce the same litter hazard the read-only CELL
# mount avoids. That reasoning does not survive: this job's own steps never
# write anything into `$GITHUB_WORKSPACE` beyond what `actions/checkout`
# itself writes (as root, consistently, on every run this job's own pinned
# image is used for -- there is no unprivileged run left to poison), and the
# axis's own packages still come exclusively from the CELL's image inside a
# brand-new sibling container the outer job's own filesystem never touches
# (I.3: "the outer job's container must not become a second source of the
# cell's own packages") -- the two containers do not share a filesystem at
# all, only the read-only mount above. `docker.sock` is bind-mounted into
# the outer container via `options:` below so its own steps can still issue
# the nested `docker run` per cell.
#
# CORRECTION (task 079, steer 011): an earlier comment here claimed
# `fetch-depth: 0` meant "no image needs git installed" -- the operator
# states in steer 011 that that premise was theirs, from steer 008, and was
# wrong. `fetch-depth: 0` on the HOST checkout supplies the `.git` DIRECTORY
# (so tests that read real commit history see it once it is copied in), but
# the suite itself EXECS the `git` BINARY at run time, inside the CELL,
# against that directory: `test_host_like_pytest_script` (a `git show` of a
# pre-fix revision) and `test_petitions`, among others, shell out to `git`. Every cell image below therefore
# gets `git` installed (see the container command) -- the outer job's own
# container never runs this suite itself, so its own git is irrelevant to
# this requirement.
#
# NOTE: `schedule` only fires on the repository's default branch, so this
# workflow does nothing until it is merged to main. Use `workflow_dispatch` to
# exercise it from a branch.
name: nightly

on:
  schedule:
    # 02:00 UTC -- the pool is otherwise idle at that hour.
    - cron: '0 2 * * *'
  workflow_dispatch:

# Task 013 (requirement J.2): a scheduled run and a manual `workflow_dispatch`
# of this same workflow had no relationship to each other before this -- a
# dispatch fired while the 02:00 UTC cron run was still in flight landed on
# the pool as a SEVENTH and EIGHTH concurrent claim on top of the matrix's
# own six, with no mechanism stopping it. A `concurrency:` group is blind
# across *workflows* (heavy.yml's own comment on the browser tier says so,
# and docs/ci.md repeats it for this exact pair) but it is exactly the right
# tool WITHIN one workflow, which this is. Keyed on `github.ref` rather than
# a fixed literal so a `workflow_dispatch` against a branch does not queue
# behind main's own nightly run; `cancel-in-progress: false` because an
# in-flight nightly is never cancelled by a newer one: the newer run waits in
# the group instead, so a nightly that has used hours of pool time is not
# thrown away by a later dispatch or the next night's cron.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev-layout:
    name: dev-layout (${{ matrix.image }}, PYTHONUSERBASE ${{ matrix.mode }})
    runs-on: [self-hosted, linux, x64, ci-pool, docker-host]
    # Task 012 (requirement I): pinned to the SAME digest heavy.yml's
    # docker-tier and gate.yml's fast job already use -- python:3.12.3,
    # ships curl+tar for the docker-client fetch below, defaults to uid 0
    # (this job's own steps never need a non-root switch: they only
    # ORCHESTRATE the per-cell nested `docker run`, whose OWN payload
    # already drops to uid 1000 via `setpriv` -- unchanged below). `options:`
    # mounts the host's own docker socket, the identical
    # `-v /var/run/docker.sock:/var/run/docker.sock` shape heavy.yml's
    # docker-tier and `docs/architecture.md`'s `--allow-docker` section both
    # use, for the same reason: this job's own steps issue `docker run` for
    # each cell and need a client and a reachable daemon to do it.
    #
    # Host-path translation (I.2): GitHub Actions' own self-hosted
    # `container:` runtime does NOT bind-mount `$GITHUB_WORKSPACE` at an
    # identical host path (measured, not assumed -- see heavy.yml's docker-
    # tier header and `scripts/resolve_container_host_path.sh`'s own header
    # for the run that caught it). Each step below that needs the real host
    # path resolves it FRESH, in its own running shell, by asking the docker
    # daemon itself over this same `options:` socket for this container's
    # own real host path -- never via `$GITHUB_ENV` across steps, which was
    # measured NOT to reach a later step's own `docker exec` on this self-
    # hosted runner (see the "Resolve and assert..." step's own header).
    container:
      image: python:3.12.3@sha256:3966b81808d864099f802080d897cef36c01550472ab3955fdd716d1c665acd6
      options: -v /var/run/docker.sock:/var/run/docker.sock
    # Task 035 (steer 026 §4): a wall-clock guard on the CI job, not a test
    # assertion or a node timeout -- 60 was already marginal (58 min observed
    # at bd284e79 with no interference from a concurrent heavy/gate run on
    # the same 4-core box), and task 035's cure adds real per-attempt wall
    # time to any cell that has to re-arm its startup watchdog under
    # contention. Raised, not widened out of caution alone.
    timeout-minutes: 120
    strategy:
      # Six independent claims -- one red cell must never cancel another.
      fail-fast: false
      # No `max-parallel`: the six cells run in parallel, one per pool runner
      # (the scaler starts a runner per queued job). Each cell's own `--cpus`
      # flag below bounds its CPU share.
      matrix:
        include:
          - image: ubuntu:24.04
            mode: exported
          - image: ubuntu:24.04
            mode: unset
          - image: python:3.11-slim
            mode: exported
          - image: python:3.11-slim
            mode: unset
          - image: python:3.14-slim
            mode: exported
          - image: python:3.14-slim
            mode: unset
    steps:
      # Task 054 (K.3): stamp this cell's start, its declared bound and a
      # fresh per-cell evidence directory, so the classifier step at the
      # end can tell a `timeout-minutes` kill from a human cancel. This
      # lane's own bound was raised once already because a cell came close
      # to it (see the header comment on `timeout-minutes` above), so it is
      # precisely where a `cancelled` conclusion most needed disambiguating.
      # See scripts/job_timeout_marker.sh's header.
      - name: Record the job start time
        run: |
          echo "RALPHD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "RALPHD_JOB_BOUND_MINUTES=120" >> "$GITHUB_ENV"
          evidence="${RUNNER_TEMP:-/tmp}/ralphd-timeout-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          echo "RALPHD_TIMEOUT_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Task 012 (requirement I.1): the docker CLIENT this job's own steps
      # need to reach the socket `options:` above mounted -- the base image
      # ships neither. Static, pinned binary: the identical recipe and
      # version `container/Dockerfile` and heavy.yml's docker-tier already
      # use, so no apt/network-repo dependency and no version drift.
      - name: Install the docker client for this pinned container
        run: |
          scripts/run_bounded.sh 90 "docker client install" -- bash -euo pipefail -c '
            curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz" \
              | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
            docker --version
          '

      # Task 012 (requirement I.2): THE HOST-PATH TRANSLATION.
      #
      # MEASURED, not assumed (heavy.yml run 35163222049, job 105018454092):
      # GitHub Actions' self-hosted `container:` runtime does NOT bind-mount
      # `$GITHUB_WORKSPACE` at an identical host path -- it mounts the
      # runner's own `_work` directory at the fixed in-container path `/__w`
      # regardless of the runner host's own absolute path, so a naive
      # `docker run -v "$GITHUB_WORKSPACE":...` mounts an EMPTY directory (the
      # daemon auto-creates one at that literal string on the real host,
      # which by coincidence never exists there). `scripts/
      # resolve_container_host_path.sh` gets the real host path the only way
      # available to a container with no other knowledge of its own
      # placement: it asks the docker daemon, over the very socket `options:`
      # mounted above, for THIS container's own `Mounts` table (`docker
      # inspect` on `$(cat /etc/hostname)`, docker's own default hostname for
      # a container with no `--hostname`/`--network host` override, both
      # true here), whose `Source` field on each entry already IS the host's
      # own path, then appends whatever tail of `$GITHUB_WORKSPACE` falls
      # past the closest-covering `Destination`.
      #
      # MEASURED AGAIN (task 012, attempt 2, live evidence -- see heavy.yml's
      # own copy of this header for the full account): a two-step shape (one
      # step resolving the path into `$GITHUB_ENV`, a later step reading
      # `$RALPHD_HOST_WORKSPACE` back) failed on this self-hosted runner --
      # the value a later step's own `docker exec` actually saw was the
      # CONTAINER path, not the resolved host path the earlier step had
      # exported, even though the runner's own displayed `env:` header for
      # that step claimed the right value. `$GITHUB_ENV` writes do not
      # reliably reach a LATER step's own `docker exec` under this runner's
      # `container:` support. So every step below that needs the host path
      # resolves it itself, in its own running shell, with no cross-step
      # environment hand-off -- including the per-cell step further down,
      # which sets `RALPHD_HOST_WORKSPACE` as a plain local shell variable
      # right before using it, never via `$GITHUB_ENV`. Proven against a
      # disposable sibling first (never against this run's own dir): a real
      # nested `docker run` mounting the RESOLVED path saw the real file;
      # mounting `$GITHUB_WORKSPACE` unresolved did not.
      - name: Resolve and assert this container's workspace path resolves on the real host too
        run: |
          scripts/run_bounded.sh 30 "host-path resolution and assertion" -- bash -euo pipefail -c '
            host_ws="$(scripts/resolve_container_host_path.sh "$GITHUB_WORKSPACE")"
            echo "resolved $GITHUB_WORKSPACE -> $host_ws"
            docker run --rm -v "$host_ws":/check:ro \
              python:3.12.3@sha256:3966b81808d864099f802080d897cef36c01550472ab3955fdd716d1c665acd6 \
              sh -c "test -f /check/pyproject.toml && echo host-path-confirmed: pyproject.toml visible through the socket-mounted path"
          '

      - name: Report the host environment
        run: |
          echo "image: ${{ matrix.image }}  mode: ${{ matrix.mode }}"
          echo "cores: $(nproc)  mem: $(free -m | awk '/^Mem/{print $2}') MB  swap: $(free -m | awk '/^Swap/{print $2}') MB"
          docker version --format 'docker server={{.Server.Version}}'
          df -h / | tail -1

      # Mount the checkout read-only, copy it inside FIRST, and only then
      # install or build anything -- the copy precedes every install so that
      # no root-in-container process can ever touch $GITHUB_WORKSPACE. Every
      # apt-get invocation below, including the ubuntu-only python3/pip
      # branch, runs AFTER that copy.
      # git (task 079, steer 011 defect 1) is installed in ALL THREE images
      # -- see the header correction above for why a git BINARY is needed
      # despite the host checkout already supplying the .git directory.
      # python3/python3-pip stay confined to the ubuntu:24.04 branch; the
      # two python:*-slim images already ship both.
      # The suite then runs as REAL UID 1000, never root (task 079, steer
      # 011 defect 2): the account is created only when `getent passwd 1000`
      # finds none, because ubuntu:24.04 already carries uid 1000 as
      # "ubuntu" and an unconditional `useradd -u 1000` would collide and
      # fail that cell. `setpriv --init-groups` then re-derives the
      # process's supplementary-group list FROM that account, as
      # initgroups(3) would, instead of leaving root's own group list in
      # place -- load-bearing because
      # test_the_drop_keeps_an_operator_granted_supplementary_group measures
      # the DROPPED groups, and a plain uid/gid switch alone still carries
      # root's supplementary groups over.
      # No cell installs a docker client, mounts /var/run/docker.sock, or
      # otherwise gains a reachable daemon -- `-m docker` coverage stays in
      # heavy.yml's docker tier.
      # The sweep-sha guard module and its one surviving lint are retired
      # entire (requirement A.1, v0.20.2, superseding task 053's earlier
      # trim, #113 step 4): there is no guard module left, and nothing to
      # deselect for that reason -- see scripts/host_like_dev_layout.sh's
      # own header.
      # Bounded at 6300s in scripts/run_bounded.sh (task 054, K.3): with the
      # docker-client install's 90, the merged host-path resolution-and-
      # assertion step's 30, the image pull's 300 and this cell's own
      # host-path resolution's 10 (task 012, requirement I) that is 6730 of this job's 7200s
      # `timeout-minutes` budget, leaving the reserve tests/
      # test_run_bounded_timeout_marker.py requires for the steps no wrapper
      # owns (checkout and the host-environment report). A cell that wedges
      # inside the container -- an apt mirror that never answers, a startup
      # watchdog re-arming forever -- now reports a step `failure` naming
      # this cell instead of the job-level bound's `cancelled`, which is not
      # a verdict. The bound wraps `docker run` itself, so the TERM it sends
      # is forwarded to the container by docker as usual.
      #
      # `RALPHD_HOST_WORKSPACE` is resolved FRESH here, as a plain local
      # shell variable, in the SAME step that uses it -- never read back from
      # `$GITHUB_ENV` (see the "Resolve and assert..." step's header above
      # for why: that write does not reliably reach a later step's own
      # `docker exec` on this self-hosted runner).
      # Explicit, bounded pull of THIS cell's image, before the step that runs
      # the cell's container. A pool runner starts with a cold image cache, so
      # the implicit pull inside `docker run` used to be where a registry blip
      # failed a whole cell (or spent the cell's own bound unseen). Up to three
      # attempts, ten seconds apart, all inside one 300 s run_bounded call; a
      # pull that never succeeds fails THIS step, by name.
      - name: Pull the cell image with a bounded retry
        env:
          CELL_IMAGE: ${{ matrix.image }}
        run: |
          scripts/run_bounded.sh 300 "cell image pull" -- bash -euo pipefail -c '
            for attempt in 1 2 3; do
              if docker pull "$CELL_IMAGE"; then
                exit 0
              fi
              echo "pull attempt $attempt of 3 failed for $CELL_IMAGE"
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            exit 1
          '

      - name: Dev-layout mode (containerized)
        env:
          CELL_IMAGE: ${{ matrix.image }}
          CELL_MODE: ${{ matrix.mode }}
        run: |
          RALPHD_HOST_WORKSPACE="$(scripts/run_bounded.sh 10 "cell host-path resolution" -- scripts/resolve_container_host_path.sh "$GITHUB_WORKSPACE")"
          # Task 013 (requirement J.1): an explicit CPU share rather than
          # whatever the host has left over, so six parallel cells beside
          # other pool jobs do not starve each other.
          #
          # pip resilience: PIP_DEFAULT_TIMEOUT / PIP_RETRIES ride into the
          # cell so a slow package index retries instead of failing the cell.
          # The `ci-pip-cache` docker volume is the pip cache directory of the
          # user that runs the dev-layout script (uid 1000): the
          # script reads HOST_LIKE_DEV_LAYOUT_PIP_CACHE_DIR, its default being
          # a per-container /tmp path that every cell would lose. A fresh
          # volume is root-owned, so the cell chowns it before the drop.
          scripts/run_bounded.sh 6300 "dev-layout cell" -- docker run --rm \
            --cpus="2" \
            -e PIP_DEFAULT_TIMEOUT=60 \
            -e PIP_RETRIES=10 \
            -e HOST_LIKE_DEV_LAYOUT_PIP_CACHE_DIR=/pip-cache \
            -v ci-pip-cache:/pip-cache \
            -e HOST_LIKE_DEV_LAYOUT_PYTHONUSERBASE_MODE="$CELL_MODE" \
            -e CELL_IMAGE="$CELL_IMAGE" \
            -v "$RALPHD_HOST_WORKSPACE:/src-ro:ro" \
            "$CELL_IMAGE" bash -c '
              set -euo pipefail
              cp -a /src-ro /src

              apt-get update -qq
              apt-get install -y -qq git >/dev/null
              if [ "$CELL_IMAGE" = "ubuntu:24.04" ]; then
                apt-get install -y -qq python3 python3-pip >/dev/null
              fi

              getent passwd 1000 >/dev/null || useradd -u 1000 -m -s /bin/bash dev
              CELL_USER="$(getent passwd 1000 | cut -d: -f1)"
              CELL_HOME="$(getent passwd 1000 | cut -d: -f6)"
              CELL_GID="$(getent passwd 1000 | cut -d: -f4)"
              mkdir -p "$CELL_HOME"
              chown -R 1000:"$CELL_GID" "$CELL_HOME" /src /pip-cache

              cd /src
              setpriv --reuid=1000 --regid="$CELL_GID" --init-groups \
                env HOME="$CELL_HOME" scripts/host_like_dev_layout.sh
            '

      # Task 054 (K.3), the classifier half: runs even when this cell is
      # cancelled. It prints RALPHD_TIMEOUT_KILL only when a bounded step
      # above recorded a real wall-clock expiry, and
      # RALPHD_CANCEL_NOT_TIMEOUT when this cell's status is `cancelled`
      # with no such record. Always exits 0, so it can never change a
      # cell's outcome.
      - name: Classify a job-level timeout kill
        if: always()
        run: scripts/job_timeout_marker.sh 120 "nightly dev-layout cell" "${{ job.status }}"
