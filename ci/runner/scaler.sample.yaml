# Sample config for ci/runner_scaler.py. Copy to ~/.config/ralphd-ci/scaler.yaml.
# The GitHub token is never written here: token_file names a file (mode 0600)
# that holds it, and a config carrying an inline token is refused at load.
repo: n-orlov/ralphd
token_file: ~/.config/ralphd-ci/github-token

# Two containers of 4 CPUs is 8, within the 11 usable on a 12-CPU host.
max_concurrency: 2
host_cpus: 12
poll_interval_s: 5

# The default profile is 4 CPUs, 12g, 4096 pids; a label keys a further profile.
profiles:
  browser-runner:
    cpus: 4
    memory: 16g
